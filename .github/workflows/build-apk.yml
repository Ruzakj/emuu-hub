name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: emuhub-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-37" "ndk;27.0.12077973" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Restore PPSSPP v1.20.4 source
        id: ppsspp-source-cache
        uses: actions/cache@v4
        with:
          path: third_party/ppsspp
          key: ppsspp-standalone-source-v1.20.4-r1

      - name: Fetch PPSSPP standalone source
        if: steps.ppsspp-source-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf third_party/ppsspp
          mkdir -p third_party
          git clone --depth 1 --branch v1.20.4 --recurse-submodules --shallow-submodules https://github.com/hrydgard/ppsspp.git third_party/ppsspp

      - name: Verify PPSSPP source
        run: |
          test -s third_party/ppsspp/CMakeLists.txt
          test -s third_party/ppsspp/android/src/org/ppsspp/ppsspp/PpssppActivity.java
          test -d third_party/ppsspp/assets
          rm -f app/src/main/jniLibs/arm64-v8a/libppsspp_core.so

      - name: Restore cached mGBA core
        id: mgba-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libmgba_core.so
          key: mgba-arm64-libretro-v1

      - name: Download mGBA ARM64 core on cache miss
        if: steps.mgba-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/mgba
          curl --retry 3 --retry-delay 2 -fL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mgba_libretro_android.so.zip" -o /tmp/mgba.zip
          unzip -q /tmp/mgba.zip -d /tmp/mgba
          CORE=$(find /tmp/mgba -type f -name '*.so' | head -n 1)
          test -n "$CORE"
          cp "$CORE" app/src/main/jniLibs/arm64-v8a/libmgba_core.so

      - name: Restore cached FCEUmm core
        id: fceumm-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libfceumm_core.so
          key: fceumm-arm64-libretro-v1

      - name: Download FCEUmm ARM64 core on cache miss
        if: steps.fceumm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/fceumm
          curl --retry 3 --retry-delay 2 -fL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/fceumm_libretro_android.so.zip" -o /tmp/fceumm.zip
          unzip -q /tmp/fceumm.zip -d /tmp/fceumm
          CORE=$(find /tmp/fceumm -type f -name '*.so' | head -n 1)
          test -n "$CORE"
          cp "$CORE" app/src/main/jniLibs/arm64-v8a/libfceumm_core.so

      - name: Restore cached Snes9x core
        id: snes9x-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libsnes9x_core.so
          key: snes9x-arm64-libretro-v1

      - name: Download Snes9x ARM64 core on cache miss
        if: steps.snes9x-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/snes9x
          curl --retry 3 --retry-delay 2 -fL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/snes9x_libretro_android.so.zip" -o /tmp/snes9x.zip
          unzip -q /tmp/snes9x.zip -d /tmp/snes9x
          CORE=$(find /tmp/snes9x -type f -name '*.so' | head -n 1)
          test -n "$CORE"
          cp "$CORE" app/src/main/jniLibs/arm64-v8a/libsnes9x_core.so

      - name: Restore cached PCSX-ReARMed core
        id: pcsx-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_core.so
          key: pcsx-rearmed-arm64-libretro-v1

      - name: Download PCSX-ReARMed ARM64 core on cache miss
        if: steps.pcsx-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/pcsx
          curl --retry 3 --retry-delay 2 -fL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/pcsx_rearmed_libretro_android.so.zip" -o /tmp/pcsx.zip
          unzip -q /tmp/pcsx.zip -d /tmp/pcsx
          CORE=$(find /tmp/pcsx -type f -name '*.so' | head -n 1)
          test -n "$CORE"
          cp "$CORE" app/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_core.so

      - name: Verify libretro cores
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libmgba_core.so
          test -s app/src/main/jniLibs/arm64-v8a/libfceumm_core.so
          test -s app/src/main/jniLibs/arm64-v8a/libsnes9x_core.so
          test -s app/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_core.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Build offline emulator APK
        run: gradle assembleDebug --build-cache --parallel --stacktrace

      - name: Verify embedded engines
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/(libemuhost|libmgba_core|libfceumm_core|libsnes9x_core|libpcsx_rearmed_core|libppsspp_jni)\.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/lang/'
          ! unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'libppsspp_core.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmuHub-PPSSPP-BuiltIn-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error
