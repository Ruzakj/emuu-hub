name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Bundle mGBA ARM64 core
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/mgba
          curl -fL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mgba_libretro_android.so.zip" -o /tmp/mgba.zip
          unzip -q /tmp/mgba.zip -d /tmp/mgba
          CORE=$(find /tmp/mgba -type f -name '*.so' | head -n 1)
          test -n "$CORE"
          cp "$CORE" app/src/main/jniLibs/arm64-v8a/libmgba_core.so
          test -s app/src/main/jniLibs/arm64-v8a/libmgba_core.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build offline emulator APK
        run: gradle assembleDebug --stacktrace

      - name: Verify embedded native cores
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/(libemuhost|libmgba_core)\.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmuHub-mGBA-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
