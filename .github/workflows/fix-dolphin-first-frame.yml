name: Fix Dolphin Stable First Frame

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-dolphin-first-frame.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Harden Dolphin runtime prepare path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/ric/emuhub/GameActivity.kt')
          s=p.read_text()
          old='''        traceCoreStage("prepare", coreId, romName)\n        if (coreId == "ppsspp") installPpssppAssets(systemRoot)\n        if (coreId == "dolphin") installDolphinAssets(systemRoot)\n        val saveDir = StoragePaths.savesDir(this)\n        stateFile = File(StoragePaths.statesDir(this), "${coreId}_${safeStateKey(romName)}_slot0.state")\n        val corePath = EnginePackManager.corePath(this, coreFile) ?: (applicationInfo.nativeLibraryDir + "/$coreFile")\n'''
          new='''        traceCoreStage("prepare", coreId, romName)\n        if (coreId == "ppsspp") installPpssppAssets(systemRoot)\n        if (coreId == "dolphin") {\n            traceCoreStage("prepare_dolphin_assets", coreId, romName)\n            if (!installDolphinAssets(systemRoot)) {\n                traceCoreStage("prepare_dolphin_assets_failed", coreId, romName, false)\n                showLoadError("Dolphin Sys assets tidak ada di APK. Update Emu Hub ke build terbaru.")\n                return\n            }\n            traceCoreStage("prepare_dolphin_assets_ok", coreId, romName)\n        }\n        val saveDir = StoragePaths.savesDir(this)\n        stateFile = File(StoragePaths.statesDir(this), "${coreId}_${safeStateKey(romName)}_slot0.state")\n        traceCoreStage("resolve_core", coreId, romName)\n        val corePath = EnginePackManager.corePath(this, coreFile) ?: (applicationInfo.nativeLibraryDir + "/$coreFile")\n        traceCoreStage("resolve_core_done", coreId, romName)\n'''
          if old not in s: raise SystemExit('prepare block not found')
          s=s.replace(old,new,1)
          old2='''    private fun installDolphinAssets(root:File){\n        val target=File(root,"dolphin-emu/Sys")\n        val marker=File(target,".emuhub_dolphin_sys_v1")\n        if(marker.exists())return\n        target.mkdirs()\n        copyAssetTree("Dolphin/Sys",target)\n        if(File(target,"GC/font_western.bin").isFile && File(target,"GC/dsp_rom.bin").isFile && File(target,"GC/dsp_coef.bin").isFile) runCatching{marker.writeText("1")}\n    }\n'''
          new2='''    private fun installDolphinAssets(root:File):Boolean{\n        val target=File(root,"dolphin-emu/Sys")\n        val marker=File(target,".emuhub_dolphin_sys_v2")\n        val required={ File(target,"GC/font_western.bin").isFile && File(target,"GC/dsp_rom.bin").isFile && File(target,"GC/dsp_coef.bin").isFile }\n        if(marker.exists() && required()) return true\n        return runCatching {\n            val packaged=assets.list("Dolphin/Sys") ?: emptyArray()\n            if(packaged.isEmpty()) return@runCatching false\n            target.mkdirs()\n            copyAssetTree("Dolphin/Sys",target)\n            if(required()){ marker.writeText("2"); true } else false\n        }.getOrElse {\n            runCatching { coreTraceFile.appendText("JAVA ${System.currentTimeMillis()} dolphin_asset_exception=${it.javaClass.simpleName}:${it.message}\\n") }\n            false\n        }\n    }\n'''
          if old2 not in s: raise SystemExit('installer block not found')
          p.write_text(s.replace(old2,new2,1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/GameActivity.kt
          git commit -m 'Harden Dolphin asset prepare path and tracing'
          git push
