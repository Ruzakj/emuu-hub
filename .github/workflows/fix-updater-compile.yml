name: Fix updater compile
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-updater-compile.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale ApkAsset call
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/ric/emuhub/UpdateActivity.kt')
          s=p.read_text()
          old='''                            status.text = "Update ready • $tag"\n                            action.text = "DOWNLOAD & UPDATE"; action.isEnabled = true\n                            action.setOnClickListener { prepareEnginePackThenDownload(apk.first, apk.second) }'''
          new='''                            status.text = "Update ready • $tag • ${formatBytes(apk.size)}"\n                            action.text = "DOWNLOAD & UPDATE"; action.isEnabled = true\n                            action.setOnClickListener { prepareEnginePackThenDownload(apk) }'''
          if old not in s:
              raise SystemExit('stale updater call not found')
          p.write_text(s.replace(old,new))
      - name: Commit source fix and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/UpdateActivity.kt
          git rm .github/workflows/fix-updater-compile.yml
          git commit -m "Fix updater ApkAsset compile regression"
          git push
