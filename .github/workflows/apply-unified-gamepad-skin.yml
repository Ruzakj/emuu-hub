name: Apply Unified Gamepad Skin

on:
  push:
    paths:
      - '.github/workflows/apply-unified-gamepad-skin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply modern joystick/gamepad skin
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'pattern not found: {label}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------
          # Libretro / PSP / PS1 / SNES / GBA / NES overlay
          # ------------------------------------------------------------
          p = Path('app/src/main/java/com/ric/emuhub/GameActivity.kt')
          s = p.read_text()
          s = replace_once(s,
          '''import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.drawable.GradientDrawable''',
          '''import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.StateListDrawable''', 'GameActivity imports')

          old = '''    private fun translucentBackground(alpha:Int=120,stroke:Boolean=true,radiusDp:Int=18)=GradientDrawable().apply{shape=GradientDrawable.RECTANGLE;cornerRadius=dp(radiusDp).toFloat();setColor((alpha shl 24) or 0x00202024);if(stroke)setStroke(dp(1),0x55FFFFFF)}
              private fun roundBackground(alpha:Int=105)=GradientDrawable().apply{shape=GradientDrawable.OVAL;setColor((alpha shl 24) or 0x00202024);setStroke(dp(1),0x55FFFFFF)}
              private fun gameButton(label:String,id:Int,sizeDp:Int=58)=Button(this).apply{text=label;textSize=if(label.length>2)11f else 17f;minWidth=0;minHeight=0;minimumWidth=0;minimumHeight=0;includeFontPadding=false;setPadding(0,0,0,0);background=roundBackground();alpha=.82f;setTextColor(0xFFFFFFFF.toInt());setOnTouchListener{v,e->when(e.actionMasked){MotionEvent.ACTION_DOWN->{NativeBridge.setButton(id,true);v.alpha=1f};MotionEvent.ACTION_UP,MotionEvent.ACTION_CANCEL->{NativeBridge.setButton(id,false);v.alpha=.82f}};true}}
              private fun smallOverlayButton(label:String,onClick:(Button)->Unit)=Button(this).apply{text=label;textSize=10f;minWidth=0;minHeight=0;minimumWidth=0;minimumHeight=0;setPadding(dp(8),0,dp(8),0);setTextColor(0xFFFFFFFF.toInt());background=translucentBackground(105,radiusDp=12);alpha=.78f;setOnClickListener{onClick(this)}}'''
          new = '''    private fun padShape(round:Boolean=false, pressed:Boolean=false, alpha:Int=154)=GradientDrawable().apply{
                  shape=if(round) GradientDrawable.OVAL else GradientDrawable.RECTANGLE
                  cornerRadius=if(round) 999f else dp(18).toFloat()
                  if(pressed){
                      setColor(Color.argb((alpha+50).coerceAtMost(235),46,92,128))
                      setStroke(dp(2),Color.argb(225,184,226,255))
                  }else{
                      setColor(Color.argb(alpha,19,22,27))
                      setStroke(dp(1),Color.argb(118,255,255,255))
                  }
              }
              private fun padState(round:Boolean=false,alpha:Int=154)=StateListDrawable().apply{
                  addState(intArrayOf(android.R.attr.state_pressed),padShape(round,true,alpha))
                  addState(intArrayOf(),padShape(round,false,alpha))
              }
              private fun controllerShell()=View(this).apply{
                  background=GradientDrawable().apply{shape=GradientDrawable.RECTANGLE;cornerRadius=dp(44).toFloat();setColor(Color.argb(58,13,15,19));setStroke(dp(1),Color.argb(54,255,255,255))}
              }
              private fun translucentBackground(alpha:Int=120,stroke:Boolean=true,radiusDp:Int=18)=padShape(false,false,alpha)
              private fun roundBackground(alpha:Int=105)=padShape(true,false,alpha)
              private fun gameButton(label:String,id:Int,sizeDp:Int=58)=Button(this).apply{
                  val round=label !in setOf("L","R","L1","R1","L2","R2","SELECT","START")
                  text=label;textSize=if(label.length>3)9f else if(label.length>2)10f else 17f
                  typeface=Typeface.create(Typeface.DEFAULT,Typeface.BOLD)
                  minWidth=0;minHeight=0;minimumWidth=0;minimumHeight=0;includeFontPadding=false;setPadding(0,0,0,0)
                  background=padState(round,if(round)145 else 132);alpha=.92f;setTextColor(Color.WHITE);stateListAnimator=null
                  setOnTouchListener{v,e->when(e.actionMasked){MotionEvent.ACTION_DOWN->{NativeBridge.setButton(id,true);v.alpha=1f};MotionEvent.ACTION_UP,MotionEvent.ACTION_CANCEL->{NativeBridge.setButton(id,false);v.alpha=.92f}};true}
              }
              private fun smallOverlayButton(label:String,onClick:(Button)->Unit)=Button(this).apply{
                  text=label;textSize=9f;typeface=Typeface.create(Typeface.DEFAULT,Typeface.BOLD);minWidth=0;minHeight=0;minimumWidth=0;minimumHeight=0
                  setPadding(dp(8),0,dp(8),0);setTextColor(Color.WHITE);background=padState(false,105);alpha=.86f;stateListAnimator=null;setOnClickListener{onClick(this)}
              }'''
          s = replace_once(s, old, new, 'GameActivity gamepad helpers')

          s = replace_once(s,
          '''        val overlay=FrameLayout(this);val tools=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL;gravity=Gravity.CENTER}''',
          '''        val overlay=FrameLayout(this)
                  val dualStick=coreId=="pcsx"||coreId=="ppsspp"
                  overlay.addView(controllerShell(),FrameLayout.LayoutParams(dp(if(dualStick)350 else 210),dp(194),Gravity.BOTTOM or Gravity.START).apply{leftMargin=dp(8);bottomMargin=dp(5)})
                  overlay.addView(controllerShell(),FrameLayout.LayoutParams(dp(220),dp(194),Gravity.BOTTOM or Gravity.END).apply{rightMargin=dp(8);bottomMargin=dp(5)})
                  val tools=LinearLayout(this).apply{orientation=LinearLayout.HORIZONTAL;gravity=Gravity.CENTER}''', 'GameActivity controller shell')

          start = s.index('    inner class AnalogStickView:View(this@GameActivity)')
          end = s.index('\n\n\n    private fun installPpssppAssets', start)
          controls = '''    inner class AnalogStickView:View(this@GameActivity){
                  private val basePaint=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(94,17,20,25)}
                  private val ringPaint=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(132,255,255,255);style=Paint.Style.STROKE;strokeWidth=dp(2).toFloat()}
                  private val guidePaint=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(48,255,255,255);style=Paint.Style.STROKE;strokeWidth=dp(1).toFloat()}
                  private val knobPaint=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(215,76,81,90)}
                  private val knobStroke=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(170,255,255,255);style=Paint.Style.STROKE;strokeWidth=dp(2).toFloat()}
                  private val shinePaint=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(46,255,255,255)}
                  private var knobX=0f;private var knobY=0f;private var active=false
                  override fun onDraw(canvas:Canvas){
                      val cx=width/2f;val cy=height/2f;val outer=min(width,height)*.45f;val knob=outer*.43f
                      canvas.drawCircle(cx,cy,outer,basePaint);canvas.drawCircle(cx,cy,outer,ringPaint);canvas.drawCircle(cx,cy,outer*.70f,guidePaint);canvas.drawCircle(cx,cy,outer*.36f,guidePaint)
                      knobPaint.color=if(active)Color.rgb(57,105,142) else Color.rgb(76,81,90)
                      canvas.drawCircle(cx+knobX,cy+knobY,knob,knobPaint);canvas.drawCircle(cx+knobX,cy+knobY,knob,knobStroke)
                      canvas.drawCircle(cx+knobX-knob*.22f,cy+knobY-knob*.24f,knob*.30f,shinePaint)
                  }
                  override fun onTouchEvent(e:MotionEvent):Boolean{
                      val cx=width/2f;val cy=height/2f;val max=min(width,height)*.34f
                      when(e.actionMasked){
                          MotionEvent.ACTION_DOWN,MotionEvent.ACTION_MOVE->{active=true;var dx=e.x-cx;var dy=e.y-cy;val d=sqrt(dx*dx+dy*dy);if(d>max&&d>0f){dx=dx/d*max;dy=dy/d*max};knobX=dx;knobY=dy;NativeBridge.setAnalog(((dx/max)*32767).toInt(),((dy/max)*32767).toInt());invalidate()}
                          MotionEvent.ACTION_UP,MotionEvent.ACTION_CANCEL->{active=false;knobX=0f;knobY=0f;NativeBridge.setAnalog(0,0);invalidate()}
                      };return true
                  }
              }
              inner class DPadView:View(this@GameActivity){
                  private val base=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(160,31,34,40)}
                  private val pressed=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(225,49,94,130)}
                  private val outline=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(135,255,255,255);style=Paint.Style.STROKE;strokeWidth=dp(2).toFloat()}
                  private val arrow=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(225,255,255,255);textAlign=Paint.Align.CENTER;typeface=Typeface.create(Typeface.DEFAULT,Typeface.BOLD)}
                  private var activeId=-1
                  override fun onDraw(c:Canvas){
                      val size=min(width,height).toFloat();val cx=width/2f;val cy=height/2f;val arm=size*.34f;val half=size*.48f;val r=arm*.24f
                      val v=RectF(cx-arm/2,cy-half,cx+arm/2,cy+half);val h=RectF(cx-half,cy-arm/2,cx+half,cy+arm/2)
                      c.drawRoundRect(v,r,r,base);c.drawRoundRect(h,r,r,base);c.drawRoundRect(v,r,r,outline);c.drawRoundRect(h,r,r,outline)
                      when(activeId){4->c.drawRoundRect(RectF(cx-arm/2,cy-half,cx+arm/2,cy),r,r,pressed);5->c.drawRoundRect(RectF(cx-arm/2,cy,cx+arm/2,cy+half),r,r,pressed);6->c.drawRoundRect(RectF(cx-half,cy-arm/2,cx,cy+arm/2),r,r,pressed);7->c.drawRoundRect(RectF(cx,cy-arm/2,cx+half,cy+arm/2),r,r,pressed)}
                      arrow.textSize=size*.15f;val fm=arrow.fontMetrics;val adj=-(fm.ascent+fm.descent)/2
                      c.drawText("▲",cx,cy-size*.29f+adj,arrow);c.drawText("▼",cx,cy+size*.29f+adj,arrow);c.drawText("◀",cx-size*.29f,cy+adj,arrow);c.drawText("▶",cx+size*.29f,cy+adj,arrow)
                  }
                  private fun idAt(x:Float,y:Float):Int{val dx=x-width/2f;val dy=y-height/2f;return if(kotlin.math.abs(dx)>kotlin.math.abs(dy)){if(dx<0)6 else 7}else{if(dy<0)4 else 5}}
                  override fun onTouchEvent(e:MotionEvent):Boolean{when(e.actionMasked){MotionEvent.ACTION_DOWN,MotionEvent.ACTION_MOVE->{val id=idAt(e.x,e.y);if(id!=activeId){if(activeId>=0)NativeBridge.setButton(activeId,false);activeId=id;NativeBridge.setButton(id,true);invalidate()}};MotionEvent.ACTION_UP,MotionEvent.ACTION_CANCEL->{if(activeId>=0)NativeBridge.setButton(activeId,false);activeId=-1;invalidate()}};return true}
              }'''
          s = s[:start] + controls + s[end:]
          p.write_text(s)

          # ------------------------------------------------------------
          # Native PS2 / ARMSX2 overlay
          # ------------------------------------------------------------
          p = Path('app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt')
          s = p.read_text()
          s = replace_once(s,
          '''import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.drawable.GradientDrawable''',
          '''import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.StateListDrawable''', 'PS2 imports')

          old = '''    private fun rounded(alpha: Int = 0x77): GradientDrawable = GradientDrawable().apply {
                  setColor(Color.argb(alpha, 18, 18, 18)); cornerRadius = dp(18).toFloat(); setStroke(dp(1), Color.argb(110, 255, 255, 255))
              }

              private fun control(text: String, keyCode: Int, size: Int = 54): Button = Button(this).apply {
                  this.text = text; textSize = 16f; isAllCaps = false; setTextColor(Color.WHITE); background = rounded()
                  setPadding(0, 0, 0, 0); minWidth = 0; minHeight = 0
                  setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> { v.isPressed = true; sendPad(keyCode, true) }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { v.isPressed = false; sendPad(keyCode, false) }
                      }
                      true
                  }
                  layoutParams = FrameLayout.LayoutParams(dp(size), dp(size))
              }'''
          new = '''    private fun padShape(round:Boolean=false,pressed:Boolean=false,alpha:Int=150):GradientDrawable=GradientDrawable().apply{
                  shape=if(round)GradientDrawable.OVAL else GradientDrawable.RECTANGLE
                  cornerRadius=if(round)999f else dp(18).toFloat()
                  if(pressed){setColor(Color.argb((alpha+55).coerceAtMost(235),46,92,128));setStroke(dp(2),Color.argb(225,184,226,255))}
                  else{setColor(Color.argb(alpha,19,22,27));setStroke(dp(1),Color.argb(118,255,255,255))}
              }
              private fun padState(round:Boolean=false,alpha:Int=150)=StateListDrawable().apply{
                  addState(intArrayOf(android.R.attr.state_pressed),padShape(round,true,alpha));addState(intArrayOf(),padShape(round,false,alpha))
              }
              private fun controllerShell()=View(this).apply{background=GradientDrawable().apply{shape=GradientDrawable.RECTANGLE;cornerRadius=dp(44).toFloat();setColor(Color.argb(58,13,15,19));setStroke(dp(1),Color.argb(54,255,255,255))}}
              private fun rounded(alpha: Int = 0x77): GradientDrawable = padShape(false,false,alpha)

              private fun control(text: String, keyCode: Int, size: Int = 54): Button = Button(this).apply {
                  val round=text !in setOf("L1","L2","R1","R2","L3","R3","SELECT","START")
                  this.text=text;textSize=if(text.length>3)9f else if(text.length>2)10f else 16f;typeface=Typeface.create(Typeface.DEFAULT,Typeface.BOLD)
                  isAllCaps=false;setTextColor(Color.WHITE);background=padState(round,if(round)145 else 132);stateListAnimator=null
                  setPadding(0,0,0,0);minWidth=0;minHeight=0
                  setOnTouchListener { v,e -> when(e.actionMasked){MotionEvent.ACTION_DOWN->{v.isPressed=true;sendPad(keyCode,true);v.alpha=1f};MotionEvent.ACTION_UP,MotionEvent.ACTION_CANCEL->{v.isPressed=false;sendPad(keyCode,false);v.alpha=.92f}};true }
                  alpha=.92f;layoutParams=FrameLayout.LayoutParams(dp(size),dp(size))
              }'''
          s = replace_once(s, old, new, 'PS2 gamepad helpers')

          a0 = s.index('    private inner class AnalogStickView(private val rightStick: Boolean = false)')
          a1 = s.index('\n\n    private fun buildGameUi()', a0)
          analog = '''    private inner class AnalogStickView(private val rightStick: Boolean = false) : View(this@Ps2GameActivity) {
                  private val basePaint=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(94,17,20,25)}
                  private val ringPaint=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(132,255,255,255);style=Paint.Style.STROKE;strokeWidth=dp(2).toFloat()}
                  private val guidePaint=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(48,255,255,255);style=Paint.Style.STROKE;strokeWidth=dp(1).toFloat()}
                  private val knobPaint=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(215,76,81,90)}
                  private val knobStroke=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(170,255,255,255);style=Paint.Style.STROKE;strokeWidth=dp(2).toFloat()}
                  private val shinePaint=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(46,255,255,255)}
                  private var knobX=0f;private var knobY=0f;private var active=false
                  override fun onDraw(canvas:Canvas){super.onDraw(canvas);val cx=width/2f;val cy=height/2f;val outer=min(width,height)*.45f;val knob=outer*.43f;canvas.drawCircle(cx,cy,outer,basePaint);canvas.drawCircle(cx,cy,outer,ringPaint);canvas.drawCircle(cx,cy,outer*.70f,guidePaint);canvas.drawCircle(cx,cy,outer*.36f,guidePaint);knobPaint.color=if(active)Color.rgb(57,105,142)else Color.rgb(76,81,90);canvas.drawCircle(cx+knobX,cy+knobY,knob,knobPaint);canvas.drawCircle(cx+knobX,cy+knobY,knob,knobStroke);canvas.drawCircle(cx+knobX-knob*.22f,cy+knobY-knob*.24f,knob*.30f,shinePaint)}
                  override fun onTouchEvent(event:MotionEvent):Boolean{when(event.actionMasked){MotionEvent.ACTION_DOWN,MotionEvent.ACTION_MOVE->{active=true;val cx=width/2f;val cy=height/2f;var dx=event.x-cx;var dy=event.y-cy;val limit=min(width,height)*.36f;val dist=hypot(dx.toDouble(),dy.toDouble()).toFloat();if(dist>limit&&dist>0f){val scale=limit/dist;dx*=scale;dy*=scale};knobX=dx;knobY=dy;val nx=(dx/limit).coerceIn(-1f,1f);val ny=(dy/limit).coerceIn(-1f,1f);if(rightStick){sendAnalogPair(nx,PAD_R_LEFT,PAD_R_RIGHT);sendAnalogPair(ny,PAD_R_UP,PAD_R_DOWN)}else{sendAnalogPair(nx,PAD_L_LEFT,PAD_L_RIGHT);sendAnalogPair(ny,PAD_L_UP,PAD_L_DOWN)};invalidate()};MotionEvent.ACTION_UP,MotionEvent.ACTION_CANCEL->{active=false;knobX=0f;knobY=0f;if(rightStick){sendPad(PAD_R_LEFT,false);sendPad(PAD_R_RIGHT,false);sendPad(PAD_R_UP,false);sendPad(PAD_R_DOWN,false)}else{sendPad(PAD_L_LEFT,false);sendPad(PAD_L_RIGHT,false);sendPad(PAD_L_UP,false);sendPad(PAD_L_DOWN,false)};invalidate()}};return true}
              }

              private inner class DPadView:View(this@Ps2GameActivity){
                  private val base=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(160,31,34,40)}
                  private val pressed=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(225,49,94,130)}
                  private val outline=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(135,255,255,255);style=Paint.Style.STROKE;strokeWidth=dp(2).toFloat()}
                  private val arrow=Paint(Paint.ANTI_ALIAS_FLAG).apply{color=Color.argb(225,255,255,255);textAlign=Paint.Align.CENTER;typeface=Typeface.create(Typeface.DEFAULT,Typeface.BOLD)}
                  private var active=-1
                  override fun onDraw(c:Canvas){val size=min(width,height).toFloat();val cx=width/2f;val cy=height/2f;val arm=size*.34f;val half=size*.48f;val r=arm*.24f;val v=RectF(cx-arm/2,cy-half,cx+arm/2,cy+half);val h=RectF(cx-half,cy-arm/2,cx+half,cy+arm/2);c.drawRoundRect(v,r,r,base);c.drawRoundRect(h,r,r,base);c.drawRoundRect(v,r,r,outline);c.drawRoundRect(h,r,r,outline);when(active){KeyEvent.KEYCODE_DPAD_UP->c.drawRoundRect(RectF(cx-arm/2,cy-half,cx+arm/2,cy),r,r,pressed);KeyEvent.KEYCODE_DPAD_DOWN->c.drawRoundRect(RectF(cx-arm/2,cy,cx+arm/2,cy+half),r,r,pressed);KeyEvent.KEYCODE_DPAD_LEFT->c.drawRoundRect(RectF(cx-half,cy-arm/2,cx,cy+arm/2),r,r,pressed);KeyEvent.KEYCODE_DPAD_RIGHT->c.drawRoundRect(RectF(cx,cy-arm/2,cx+half,cy+arm/2),r,r,pressed)};arrow.textSize=size*.15f;val fm=arrow.fontMetrics;val adj=-(fm.ascent+fm.descent)/2;c.drawText("▲",cx,cy-size*.29f+adj,arrow);c.drawText("▼",cx,cy+size*.29f+adj,arrow);c.drawText("◀",cx-size*.29f,cy+adj,arrow);c.drawText("▶",cx+size*.29f,cy+adj,arrow)}
                  private fun keyAt(x:Float,y:Float):Int{val dx=x-width/2f;val dy=y-height/2f;return if(abs(dx)>abs(dy)){if(dx<0)KeyEvent.KEYCODE_DPAD_LEFT else KeyEvent.KEYCODE_DPAD_RIGHT}else{if(dy<0)KeyEvent.KEYCODE_DPAD_UP else KeyEvent.KEYCODE_DPAD_DOWN}}
                  override fun onTouchEvent(e:MotionEvent):Boolean{when(e.actionMasked){MotionEvent.ACTION_DOWN,MotionEvent.ACTION_MOVE->{val key=keyAt(e.x,e.y);if(key!=active){if(active>=0)sendPad(active,false);active=key;sendPad(active,true);invalidate()}};MotionEvent.ACTION_UP,MotionEvent.ACTION_CANCEL->{if(active>=0)sendPad(active,false);active=-1;invalidate()}};return true}
              }'''
          s = s[:a0] + analog + s[a1:]

          s = replace_once(s,
          '''            // Compact top controls: shoulders stay at corners, system actions no longer stack over gameplay center.''',
          '''            addControl(root,controllerShell(),Gravity.BOTTOM or Gravity.START,left=8,bottom=5,w=350,h=194)
                      addControl(root,controllerShell(),Gravity.BOTTOM or Gravity.END,right=8,bottom=5,w=350,h=194)

                      // Compact top controls: shoulders stay at corners, system actions no longer stack over gameplay center.''', 'PS2 controller shell')

          old_dpad = '''            addControl(root, control("▲", KeyEvent.KEYCODE_DPAD_UP), Gravity.BOTTOM or Gravity.START, left = 72, bottom = 126)
                      addControl(root, control("▼", KeyEvent.KEYCODE_DPAD_DOWN), Gravity.BOTTOM or Gravity.START, left = 72, bottom = 18)
                      addControl(root, control("◀", KeyEvent.KEYCODE_DPAD_LEFT), Gravity.BOTTOM or Gravity.START, left = 18, bottom = 72)
                      addControl(root, control("▶", KeyEvent.KEYCODE_DPAD_RIGHT), Gravity.BOTTOM or Gravity.START, left = 126, bottom = 72)'''
          new_dpad = '''            addControl(root,DPadView(),Gravity.BOTTOM or Gravity.START,left=18,bottom=18,w=160,h=160)'''
          s = replace_once(s, old_dpad, new_dpad, 'PS2 dpad')
          p.write_text(s)
          PY

          git config user.name 'Ruzakj'
          git config user.email '93422529+Ruzakj@users.noreply.github.com'
          git add app/src/main/java/com/ric/emuhub/GameActivity.kt app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt
          git diff --cached --check
          git commit -m 'Unify all Emu Hub touch controls with modern gamepad skin'
          git push
