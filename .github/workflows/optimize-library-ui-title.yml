name: Optimize library UI and titles
on:
  push:
    branches: [main]
    paths:
      - '.github/optimize_library.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply library optimization
        run: python .github/optimize_library.py
      - name: Commit source and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/MainActivity.kt
          git commit -m "Lighten library rendering and prefer game titles"
          rm .github/optimize_library.py .github/workflows/optimize-library-ui-title.yml
          git add -A
          git commit -m "Remove temporary library optimization tooling"
          git push
