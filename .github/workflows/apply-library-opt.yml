name: Apply Library Optimization
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-library-opt.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/optimize_main.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/MainActivity.kt
          git commit -m "Lighten library UI and clean game titles"
          git push
