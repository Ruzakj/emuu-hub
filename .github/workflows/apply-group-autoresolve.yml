name: Apply Grouping Auto Resolver

on:
  push:
    paths:
      - '.github/workflows/apply-group-autoresolve.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch grouping and auto routing
        run: python .github/scripts/group_and_autoresolve.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-group-autoresolve.yml .github/scripts/group_and_autoresolve.py
          git add app/src/main/java/com/ric/emuhub/MainActivity.kt .github/workflows/apply-group-autoresolve.yml .github/scripts/group_and_autoresolve.py
          git commit -m "Group games by console and auto-route emulator"
          git push
