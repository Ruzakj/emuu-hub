name: Test In-App Update v5

on:
  push:
    paths:
      - '.github/workflows/test-inapp-update-v5.yml'

permissions:
  contents: write
  actions: write

jobs:
  release-after-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for compressed-routing build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=33654831113
          echo "Waiting for Build Android APK #265 ($RUN_ID)..."
          while true; do
            STATUS=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq .status)
            CONCLUSION=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
            echo "status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success" || { echo "Build #265 is not green; refusing to publish v5"; exit 1; }
              break
            fi
            sleep 20
          done
      - name: Remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/test-inapp-update-v5.yml
          git add -A
          git commit -m "Remove temporary v5 update test workflow"
          git push
      - name: Dispatch stable thin-shell v5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-apk.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version_code=5 \
            -f version_name=0.4.1 \
            -f notes='Compressed ROM routing fix + in-app updater test' \
            -f thin_shell=true
          echo "Dispatched Emu Hub 0.4.1 / build 5 thin-shell release."
