name: Patch PS2 Quick Tune Scroll

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-ps2-quick-tune-scroll.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make quick tune scrollable
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt')
          s = p.read_text()
          if 'import android.widget.ScrollView\n' not in s:
              s = s.replace('import android.widget.SeekBar\n', 'import android.widget.SeekBar\nimport android.widget.ScrollView\n')
          pattern = re.compile(r'(?m)^(\s*)AlertDialog\.Builder\(this\)\n\s*\.setTitle\("PS2 QUICK TUNE • \$\{File\(romPath\)\.name\}"\)\n\s*\.setView\(panel\)\n\s*\.setPositiveButton\("DONE", null\)')
          m = pattern.search(s)
          if not m:
              raise SystemExit('Quick Tune dialog pattern not found')
          indent = m.group(1)
          replacement = f'''{indent}val scroll = ScrollView(this).apply {{
{indent}    isFillViewport = true
{indent}    addView(panel, ScrollView.LayoutParams(
{indent}        ViewGroup.LayoutParams.MATCH_PARENT,
{indent}        ViewGroup.LayoutParams.WRAP_CONTENT
{indent}    ))
{indent}}}
{indent}AlertDialog.Builder(this)
{indent}    .setTitle("PS2 QUICK TUNE • ${{File(romPath).nameWithoutExtension}}")
{indent}    .setView(scroll)
{indent}    .setPositiveButton("DONE", null)'''
          s = pattern.sub(replacement, s, count=1)
          p.write_text(s)
          PY
      - name: Verify Cycle Skip remains present
        run: |
          grep -q 'EE Cycle Skip' app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt
          grep -q 'ScrollView' app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt
          git commit -m "Make PS2 Quick Tune scrollable and restore Cycle Skip access"
          git push
