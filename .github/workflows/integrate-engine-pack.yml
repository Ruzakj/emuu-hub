name: Integrate Engine Pack
on:
  push:
    paths: ['.github/workflows/integrate-engine-pack.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path

          p=Path('app/src/main/java/com/ric/emuhub/GameActivity.kt'); s=p.read_text()
          old='''        val systemRoot = StoragePaths.systemDir(this)\n        if (coreId == "ppsspp") installPpssppAssets(systemRoot)\n        val saveDir = StoragePaths.savesDir(this)\n        stateFile = File(StoragePaths.statesDir(this), "${coreId}_${safeStateKey(romName)}_slot0.state")\n        if (!NativeBridge.init(applicationInfo.nativeLibraryDir + "/$coreFile", systemRoot.absolutePath, saveDir.absolutePath)) { showLoadError("$coreLabel core gagal inisialisasi."); return }'''
          new='''        val systemRoot = StoragePaths.systemDir(this)\n        if (coreId == "ppsspp") installPpssppAssets(systemRoot)\n        val saveDir = StoragePaths.savesDir(this)\n        stateFile = File(StoragePaths.statesDir(this), "${coreId}_${safeStateKey(romName)}_slot0.state")\n        val corePath = EnginePackManager.corePath(this, coreFile) ?: (applicationInfo.nativeLibraryDir + "/$coreFile")\n        if (!File(corePath).isFile) {\n            EnginePackManager.bootstrapAsync(this)\n            showLoadError("$coreLabel engine belum siap. Engine Pack sedang disiapkan; coba lagi setelah selesai.")\n            return\n        }\n        if (!NativeBridge.init(corePath, systemRoot.absolutePath, saveDir.absolutePath)) { showLoadError("$coreLabel core gagal inisialisasi."); return }'''
          if old not in s: raise SystemExit('GameActivity core init block not found')
          s=s.replace(old,new)
          old2='''    private fun installPpssppAssets(root:File){val target=File(root,"PPSSPP");val marker=File(target,".emuhub_assets_v1");if(marker.exists())return;target.mkdirs();copyAssetTree("PPSSPP",target);runCatching{marker.writeText("1")}}\n    private fun copyAssetTree(path:String,target:File){val entries=assets.list(path)?:return;if(entries.isEmpty()){target.parentFile?.mkdirs();assets.open(path).use{i->target.outputStream().use{i.copyTo(it)}};return};target.mkdirs();entries.forEach{copyAssetTree("$path/$it",File(target,it))}}'''
          new2='''    private fun installPpssppAssets(root:File){\n        val target=File(root,"PPSSPP")\n        val marker=File(target,".emuhub_assets_v1")\n        if(marker.exists())return\n        target.mkdirs()\n        val packed=EnginePackManager.ppssppAssetsDir(this)\n        if(packed!=null) copyFileTree(packed,target) else copyAssetTree("PPSSPP",target)\n        if(target.listFiles()?.isNotEmpty()==true) runCatching{marker.writeText("1")}\n    }\n    private fun copyFileTree(source:File,target:File){\n        if(source.isDirectory){target.mkdirs();source.listFiles()?.forEach{copyFileTree(it,File(target,it.name))}}\n        else{target.parentFile?.mkdirs();source.inputStream().buffered(1024*1024).use{i->target.outputStream().buffered(1024*1024).use{o->i.copyTo(o,1024*1024)}}}\n    }\n    private fun copyAssetTree(path:String,target:File){val entries=assets.list(path)?:return;if(entries.isEmpty()){target.parentFile?.mkdirs();assets.open(path).use{i->target.outputStream().use{i.copyTo(it)}};return};target.mkdirs();entries.forEach{copyAssetTree("$path/$it",File(target,it))}}'''
          if old2 not in s: raise SystemExit('PPSSPP asset block not found')
          p.write_text(s.replace(old2,new2))

          p=Path('app/src/main/java/com/ric/emuhub/EmuHubApp.kt'); s=p.read_text()
          old='''        val processName = currentProcessName()\n        val isPs2Process = processName.endsWith(":ps2")\n        if (!isPs2Process) {'''
          new='''        val processName = currentProcessName()\n        val isPs2Process = processName.endsWith(":ps2")\n        if (processName == packageName) EnginePackManager.bootstrapAsync(this)\n        if (!isPs2Process) {'''
          if old not in s: raise SystemExit('EmuHubApp process block not found')
          p.write_text(s.replace(old,new))

          p=Path('app/src/main/java/com/ric/emuhub/UpdateActivity.kt'); s=p.read_text()
          old='''                            action.text = "DOWNLOAD & UPDATE"; action.isEnabled = true\n                            action.setOnClickListener { downloadUpdate(apkUrl!!, apkName) }'''
          new='''                            action.text = "DOWNLOAD & UPDATE"; action.isEnabled = true\n                            action.setOnClickListener { prepareEnginePackThenDownload(apkUrl!!, apkName) }'''
          if old not in s: raise SystemExit('UpdateActivity click block not found')
          s=s.replace(old,new)
          marker='''    private fun downloadUpdate(url: String, name: String) {'''
          helper='''    private fun prepareEnginePackThenDownload(url: String, name: String) {\n        if (EnginePackManager.isInstalled(this)) { downloadUpdate(url, name); return }\n        action.isEnabled = false\n        progress.visibility = ProgressBar.VISIBLE\n        status.text = "Preparing reusable Engine Pack…"\n        io.execute {\n            val result = EnginePackManager.installBlocking(applicationContext)\n            runOnUiThread {\n                if (result.isSuccess) {\n                    status.text = "Engine Pack ready • downloading app shell…"\n                    downloadUpdate(url, name)\n                } else {\n                    progress.visibility = ProgressBar.GONE\n                    status.text = "Engine Pack gagal • ${result.exceptionOrNull()?.message ?: "unknown error"}"\n                    action.text = "TRY AGAIN"\n                    action.isEnabled = true\n                    action.setOnClickListener { prepareEnginePackThenDownload(url, name) }\n                }\n            }\n        }\n    }\n\n'''
          if marker not in s: raise SystemExit('downloadUpdate marker not found')
          p.write_text(s.replace(marker,helper+marker))
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/GameActivity.kt app/src/main/java/com/ric/emuhub/EmuHubApp.kt app/src/main/java/com/ric/emuhub/UpdateActivity.kt
          git commit -m 'Integrate reusable Engine Pack into runtime'
          git push
