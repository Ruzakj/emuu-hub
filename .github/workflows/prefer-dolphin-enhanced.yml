name: Fix Dolphin Enhanced External Launch

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix Dolphin external routing patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Dolphin launcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ric/emuhub/MainActivity.kt')
          s = p.read_text()
          start = s.index('    private fun launchDolphinExternal(uri:Uri,name:String){')
          end = s.index('\n    private fun launchEden(uri:Uri){', start)
          lines = [
              '    private fun launchDolphinExternal(uri:Uri,name:String){',
              '        val pkg = "org.mm.j"',
              '        val activity = "org.dolphinemu.dolphinemu.ui.main.MainActivity"',
              '        if (packageManager.getLaunchIntentForPackage(pkg) == null) {',
              '            Toast.makeText(this,"Dolphin Enhanced (org.mm.j) tidak terpasang.",Toast.LENGTH_LONG).show()',
              '            return',
              '        }',
              '        val directPath = directGameFile(uri)?.absolutePath',
              '        if (directPath == null) {',
              '            Toast.makeText(this,"ROM harus berasal dari storage lokal agar Dolphin Enhanced dapat membukanya langsung.",Toast.LENGTH_LONG).show()',
              '            return',
              '        }',
              '        val intent = Intent(Intent.ACTION_VIEW).apply {',
              '            setClassName(pkg,activity)',
              '            putExtra("AutoStartFile",directPath)',
              '            addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP)',
              '        }',
              '        try {',
              '            startActivity(intent)',
              '            status.text="GameCube/Wii • Dolphin Enhanced • full UI"',
              '        } catch (_:Exception) {',
              '            Toast.makeText(this,"Direct boot Dolphin Enhanced gagal.",Toast.LENGTH_LONG).show()',
              '            packageManager.getLaunchIntentForPackage(pkg)?.let { startActivity(it) }',
              '        }',
              '    }',
              ''
          ]
          p.write_text(s[:start] + '\n'.join(lines) + s[end:])
          PY
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Route GC Wii through Dolphin Enhanced full UI"
          git push
