name: Patch Runtime UX
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-runtime-ux.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch updater and PS2 runtime
        shell: python
        run: |
          from pathlib import Path

          # 1) Direct streaming updater: avoids OEM DownloadManager stalls at 0%.
          p=Path('app/src/main/java/com/ric/emuhub/UpdateActivity.kt')
          s=p.read_text()
          s=s.replace('progress = ProgressBar(this).apply { isIndeterminate = true }', 'progress = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply { isIndeterminate = true; max = 100 }')
          start=s.index('    private fun downloadUpdate(asset: ApkAsset) {')
          end=s.index('    private fun verifyDownloadedApk(file: File, asset: ApkAsset) {', start)
          block=r'''    private fun downloadUpdate(asset: ApkAsset) {
        val dir = File(getExternalFilesDir(null), "updates").apply { mkdirs() }
        dir.listFiles()?.forEach { it.deleteRecursively() }
        val apk = File(dir, asset.name.ifBlank { "EmuHub-update.apk" })
        val part = File(dir, apk.name + ".part")
        pendingApk = null
        downloadCancelled = false
        progress.isIndeterminate = false
        progress.max = 100
        progress.progress = 0
        progress.visibility = View.VISIBLE
        status.text = "Connecting • ${formatBytes(asset.size)}"
        action.text = "CANCEL DOWNLOAD"
        action.isEnabled = true
        action.setOnClickListener {
            downloadCancelled = true
            part.delete()
            apk.delete()
            pendingApk = null
            progress.visibility = View.GONE
            status.text = "Download cancelled • temporary file cleaned"
            action.text = "CHECK AGAIN"
            action.setOnClickListener { checkUpdate() }
        }
        Thread({ downloadDirect(asset, part, apk) }, "emuhub-update-download").start()
    }

    private fun downloadDirect(asset: ApkAsset, part: File, apk: File) {
        var connection: HttpURLConnection? = null
        try {
            connection = URL(asset.url).openConnection() as HttpURLConnection
            connection.instanceFollowRedirects = true
            connection.connectTimeout = 12_000
            connection.readTimeout = 45_000
            connection.setRequestProperty("User-Agent", "EmuHub-Updater/${BuildConfig.VERSION_NAME}")
            connection.setRequestProperty("Accept", APK_MIME)
            val code = connection.responseCode
            if (code !in 200..299) throw IOException("Download HTTP $code")
            val total = connection.contentLengthLong.takeIf { it > 0L } ?: asset.size
            var received = 0L
            var lastUi = 0L
            part.parentFile?.mkdirs()
            connection.inputStream.buffered(1024 * 1024).use { input ->
                part.outputStream().buffered(1024 * 1024).use { output ->
                    val buffer = ByteArray(1024 * 1024)
                    while (true) {
                        if (downloadCancelled) throw java.util.concurrent.CancellationException("cancelled")
                        val n = input.read(buffer)
                        if (n <= 0) break
                        output.write(buffer, 0, n)
                        received += n
                        val now = android.os.SystemClock.elapsedRealtime()
                        if (now - lastUi >= 180L && total > 0L) {
                            lastUi = now
                            val pct = ((received * 100L) / total).coerceIn(0L, 100L).toInt()
                            runOnUiThread {
                                progress.progress = pct
                                status.text = "Downloading • $pct% • ${formatBytes(received)} / ${formatBytes(total)}"
                            }
                        }
                    }
                }
            }
            if (downloadCancelled) throw java.util.concurrent.CancellationException("cancelled")
            if (apk.exists()) apk.delete()
            if (!part.renameTo(apk)) {
                part.copyTo(apk, overwrite = true)
                part.delete()
            }
            verifyDownloadedApk(apk, asset)
            pendingApk = apk
            runOnUiThread {
                progress.progress = 100
                status.text = "Verified • ${formatBytes(apk.length())} • ready to install"
                action.text = "INSTALL UPDATE"
                action.isEnabled = true
                action.setOnClickListener { installApk(apk) }
                installApk(apk)
            }
        } catch (_: java.util.concurrent.CancellationException) {
            part.delete(); apk.delete(); pendingApk = null
        } catch (e: Exception) {
            part.delete(); apk.delete(); pendingApk = null
            runOnUiThread {
                progress.visibility = View.GONE
                status.text = "Download failed • ${friendlyError(e)} • temporary file cleaned"
                action.text = "RETRY DOWNLOAD"
                action.isEnabled = true
                action.setOnClickListener { downloadUpdate(asset) }
            }
        } finally {
            connection?.disconnect()
        }
    }

'''
          s=s[:start]+block+s[end:]
          p.write_text(s)

          # 2) Apply persisted PS2 aspect ratio before VM starts, and expose it in quick tune.
          p=Path('app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt')
          s=p.read_text()
          needle='''            runCatching { NativeApp.renderUpscalemultiplier(activeProfile.upscale) }
            if (Build.VERSION.SDK_INT >= 33)'''
          repl='''            runCatching { NativeApp.renderUpscalemultiplier(activeProfile.upscale) }
            runCatching { NativeApp.setSetting("EmuCore/GS", "AspectRatio", "string", Ps2DisplaySettings.load(this)) }
            if (Build.VERSION.SDK_INT >= 33)'''
          if needle not in s: raise SystemExit('PS2 init anchor missing')
          s=s.replace(needle,repl,1)
          quick_anchor='''        panel.addView(resolutionButton)

        val eeButton = Button(this).apply {'''
          quick_insert='''        panel.addView(resolutionButton)

        val displayButton = Button(this).apply {
            text = "Screen: ${Ps2DisplaySettings.label(this@Ps2GameActivity)}"
            isAllCaps = false
            setOnClickListener {
                val labels = Ps2DisplaySettings.MODES.keys.toTypedArray()
                AlertDialog.Builder(this@Ps2GameActivity).setTitle("Screen Size / Aspect").setItems(labels) { d, which ->
                    val value = Ps2DisplaySettings.MODES.getValue(labels[which])
                    Ps2DisplaySettings.save(this@Ps2GameActivity, value)
                    runCatching { NativeApp.setSetting("EmuCore/GS", "AspectRatio", "string", value) }
                    runCatching { NativeApp.commitSettings() }
                    text = "Screen: ${labels[which]}"
                    d.dismiss()
                }.show()
            }
        }
        panel.addView(displayButton)

        val eeButton = Button(this).apply {'''
          if quick_anchor not in s: raise SystemExit('PS2 quick menu anchor missing')
          s=s.replace(quick_anchor,quick_insert,1)
          p.write_text(s)

          # 3) Make CHD routing explicit: PS2-folder CHDs go straight to ARMSX2; picker keeps PS1/PS2 chooser.
          p=Path('app/src/main/java/com/ric/emuhub/MainActivity.kt')
          s=p.read_text()
          old='''            "iso","chd"->folderConsoleHint(g) ?: probeIsoTarget(Uri.parse(g.uri)) ?: "DISC"'''
          new='''            "iso"->folderConsoleHint(g) ?: probeIsoTarget(Uri.parse(g.uri)) ?: "DISC"
            "chd"->folderConsoleHint(g) ?: "DISC"'''
          if old in s: s=s.replace(old,new,1)
          s=s.replace('PS2 • direct storage • ARMSX2 Vulkan','PS2 • ISO/CHD direct • ARMSX2 Vulkan')
          p.write_text(s)
      - name: Commit runtime fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/UpdateActivity.kt app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt app/src/main/java/com/ric/emuhub/MainActivity.kt
          git commit -m "Fix in-app downloads fullscreen controls and PS2 CHD routing"
          git push
