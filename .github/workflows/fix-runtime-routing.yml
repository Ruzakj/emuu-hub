name: Fix Runtime Routing
on:
  push:
    paths: ['.github/workflows/fix-runtime-routing.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/ric/emuhub/ArchiveHelper.kt'); s=p.read_text()
          s=s.replace('''        val cutoff = System.currentTimeMillis() - 60L * 60L * 1000L\n        parent.listFiles()?.forEach { if (it.lastModified() < cutoff) it.deleteRecursively() }''','''        // Archive sessions are disposable. Never keep extracted ROMs between app starts.\n        parent.listFiles()?.forEach { it.deleteRecursively() }''')
          s=s.replace('''            context.contentResolver.openInputStream(uri)?.use { input -> source.outputStream().buffered().use { output -> input.copyTo(output) } }\n                ?: error("Archive tidak dapat dibaca")''','''            // Avoid the old double-I/O path when SAF resolves to a real local file.\n            val direct = directFile(context, uri)\n            val archiveSource = direct ?: source\n            if (direct == null) {\n                context.contentResolver.openInputStream(uri)?.use { input -> source.outputStream().buffered(1024 * 1024).use { output -> input.copyTo(output, 1024 * 1024) } }\n                    ?: error("Archive tidak dapat dibaca")\n            }''')
          s=s.replace('''                archiveName.lowercase(Locale.US).endsWith(".7z") -> extract7z(source, extractRoot)\n                archiveName.lowercase(Locale.US).endsWith(".rar") -> extractRar(source, extractRoot)\n                archiveName.lowercase(Locale.US).endsWith(".zip") -> extractZip(source, extractRoot)\n                isTarName(archiveName) -> extractTar(source, extractRoot, archiveName)\n                else -> extractSingleCompressed(source, extractRoot, archiveName)''','''                archiveName.lowercase(Locale.US).endsWith(".7z") -> extract7z(archiveSource, extractRoot)\n                archiveName.lowercase(Locale.US).endsWith(".rar") -> extractRar(archiveSource, extractRoot)\n                archiveName.lowercase(Locale.US).endsWith(".zip") -> extractZip(archiveSource, extractRoot)\n                isTarName(archiveName) -> extractTar(archiveSource, extractRoot, archiveName)\n                else -> extractSingleCompressed(archiveSource, extractRoot, archiveName)''')
          marker='''    private fun isTarName(name: String): Boolean {'''
          helper='''    private fun directFile(context: Context, uri: Uri): File? {\n        if (uri.scheme == "file") return uri.path?.let(::File)?.takeIf { it.isFile && it.canRead() }\n        if (uri.scheme != "content" || uri.authority != "com.android.externalstorage.documents") return null\n        return runCatching {\n            val id = android.provider.DocumentsContract.getDocumentId(uri)\n            if (id.startsWith("raw:")) return@runCatching File(id.removePrefix("raw:")).takeIf { it.isFile && it.canRead() }\n            val parts = id.split(':', limit = 2)\n            if (parts.size != 2) return@runCatching null\n            val base = if (parts[0].equals("primary", true)) android.os.Environment.getExternalStorageDirectory() else File("/storage/${parts[0]}")\n            File(base, parts[1]).takeIf { it.isFile && it.canRead() }\n        }.getOrNull()\n    }\n\n'''
          if 'private fun directFile(context:' not in s: s=s.replace(marker,helper+marker)
          s=s.replace('val buffer = ByteArray(256 * 1024)','val buffer = ByteArray(1024 * 1024)')
          p.write_text(s)

          p=Path('app/src/main/java/com/ric/emuhub/MainActivity.kt'); s=p.read_text()
          old='''    private fun inferredConsole(g:GameEntry):String=when(g.ext){\n        "cso"->"PSP"\n        "bin","cue","ecm"->"PS1"\n        "gb","gbc","gba"->"GBA"\n        "nes"->"NES"\n        "sfc","smc"->"SNES"\n        "xci","nsp","nro"->"SWITCH"\n        "iso","chd"->{\n            val h=pathHint(g)\n            when{\n                listOf("ps2","playstation 2","pcsx2","armsx2").any{h.contains(it)}->"PS2"\n                listOf("psp","playstation portable").any{h.contains(it)}->"PSP"\n                listOf("ps1","psx","psone","playstation 1").any{h.contains(it)}->"PS1"\n                else->"DISC"\n            }\n        }\n        in ARCHIVES->"ARCHIVE"\n        else->"OTHER"\n    }'''
          new='''    private fun folderTokens(g:GameEntry)=g.folder.lowercase().split('/', '\\\\', ' ', '-', '_', '.', '(', ')', '[', ']').filter{it.isNotBlank()}.toSet()\n    private fun folderConsoleHint(g:GameEntry):String?{\n        val t=folderTokens(g); val h=g.folder.lowercase()\n        return when{\n            "ps2" in t || "pcsx2" in t || "armsx2" in t || h.contains("playstation 2")->"PS2"\n            "psp" in t || h.contains("playstation portable")->"PSP"\n            "ps1" in t || "psx" in t || "psone" in t || h.contains("playstation 1")->"PS1"\n            else->null\n        }\n    }\n    private fun inferredConsole(g:GameEntry):String=when(g.ext){\n        "cso"->"PSP"\n        "bin","cue","ecm"->"PS1"\n        "gb","gbc","gba"->"GBA"\n        "nes"->"NES"\n        "sfc","smc"->"SNES"\n        "xci","nsp","nro"->"SWITCH"\n        "iso","chd"->folderConsoleHint(g) ?: probeIsoTarget(Uri.parse(g.uri)) ?: "DISC"\n        in ARCHIVES->folderConsoleHint(g) ?: "ARCHIVE"\n        else->"OTHER"\n    }'''
          if old not in s: raise SystemExit('routing block not found')
          s=s.replace(old,new)
          s=s.replace('''    private fun openArchive(uri:Uri,name:String){\n        status.text="Preparing compressed ROM • $name"''','''    private fun openArchive(uri:Uri,name:String){\n        pendingArchiveSession?.deleteRecursively(); pendingArchiveSession=null\n        ArchiveHelper.cleanupStale(cacheDir)\n        status.text="Opening archive • $name"''')
          s=s.replace('''    override fun onActivityResult(requestCode:Int,resultCode:Int,data:Intent?){\n        super.onActivityResult(requestCode,resultCode,data)''','''    override fun onActivityResult(requestCode:Int,resultCode:Int,data:Intent?){\n        super.onActivityResult(requestCode,resultCode,data)''')
          # Auto-route extracted ISO/CHD using content signatures instead of chooser when possible.
          old2='''        when(rom.ext){\n            "iso"->showExtractedIsoChooser(session,rom)\n            "chd"->showExtractedChdChooser(session,rom)'''
          new2='''        when(rom.ext){\n            "iso"->{\n                val detected=probeIsoTarget(Uri.fromFile(rom.file))\n                when(detected){\n                    "PSP"->{writePspResolution(prefs.getString(KEY_PSP_RESOLUTION,"960x544")?:"960x544");launchTempInternalFile(rom.file,"ppsspp",rom.displayName,session.root)}\n                    "PS2"->launchExtractedPs2OrSetup(session,rom)\n                    "PS1"->launchTempInternalFile(rom.file,"pcsx",rom.displayName,session.root)\n                    else->showExtractedIsoChooser(session,rom)\n                }\n            }\n            "chd"->{\n                when(folderConsoleHint(GameEntry(Uri.fromFile(rom.file).toString(),rom.displayName,"chd",rom.file.parentFile?.path.orEmpty()))){\n                    "PS2"->launchExtractedPs2OrSetup(session,rom)\n                    "PS1"->launchTempInternalFile(rom.file,"pcsx",rom.displayName,session.root)\n                    else->showExtractedChdChooser(session,rom)\n                }\n            }'''
          if old2 not in s: raise SystemExit('extracted routing block not found')
          s=s.replace(old2,new2)
          p.write_text(s)
      - run: |
          rm .github/workflows/fix-runtime-routing.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/ArchiveHelper.kt app/src/main/java/com/ric/emuhub/MainActivity.kt .github/workflows/fix-runtime-routing.yml
          git commit -m 'Speed archive launch and improve console detection'
          git push