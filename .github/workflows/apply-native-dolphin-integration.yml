name: Apply Native Dolphin Integration

on:
  push:
    branches: [ native-dolphin-2606a ]
    paths:
      - tools/apply_native_dolphin_integration.py
      - .github/workflows/apply-native-dolphin-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-dolphin-2606a
          fetch-depth: 0
      - name: Apply deterministic routing patch
        run: |
          set -euxo pipefail
          python3 tools/apply_native_dolphin_integration.py
          git diff --check
          grep -n 'Dolphin Native 2606a' app/src/main/java/com/ric/emuhub/MainActivity.kt
          grep -n 'gcm.*rvz.*wbfs' app/src/main/java/com/ric/emuhub/ArchiveHelper.kt
      - name: Commit source integration
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/ric/emuhub/MainActivity.kt app/src/main/java/com/ric/emuhub/ArchiveHelper.kt
          if git diff --cached --quiet; then
            echo 'Routing already applied'
            exit 0
          fi
          git commit -m 'feat(dolphin): route GC Wii to native 2606a'
          git push origin HEAD:native-dolphin-2606a
