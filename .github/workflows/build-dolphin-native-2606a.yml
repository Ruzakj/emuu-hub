name: Build Dolphin Native 2606a

on:
  workflow_dispatch:
  push:
    branches:
      - native-dolphin-2606a
    paths:
      - .github/workflows/build-dolphin-native-2606a.yml
      - native-dolphin/**
      - app/src/main/java/com/ric/emuhub/DolphinSettingsActivity.kt

permissions:
  contents: read

env:
  DOLPHIN_TAG: 2606a

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Emu Hub branch
        uses: actions/checkout@v4
        with:
          ref: native-dolphin-2606a

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dolphin toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Checkout Dolphin 2606a
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .native-dolphin-src
          git clone --branch "$DOLPHIN_TAG" --depth 1 --recurse-submodules https://github.com/dolphin-emu/dolphin.git .native-dolphin-src
          git -C .native-dolphin-src rev-parse HEAD
          git -C .native-dolphin-src describe --tags --always

      - name: Build official Dolphin Android ARM64 release
        shell: bash
        working-directory: .native-dolphin-src/Source/Android
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Inspect native ARM64 libraries
        shell: bash
        run: |
          set -euxo pipefail
          APK=$(find .native-dolphin-src/Source/Android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          mkdir -p native-dolphin/out
          cp "$APK" native-dolphin/out/dolphin-2606a-upstream-arm64.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/.*\.so' | head -100
          sha256sum native-dolphin/out/dolphin-2606a-upstream-arm64.apk > native-dolphin/out/dolphin-2606a-upstream-arm64.apk.sha256

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-2606a-upstream-arm64
          path: native-dolphin/out/*
          retention-days: 7
