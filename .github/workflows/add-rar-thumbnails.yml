name: Add RAR and Thumbnails

on:
  push:
    paths:
      - '.github/workflows/add-rar-thumbnails.yml'
      - '.github/scripts/add_rar_thumbnails.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python3 .github/scripts/add_rar_thumbnails.py
      - name: Remove one-shot files
        run: rm .github/workflows/add-rar-thumbnails.yml .github/scripts/add_rar_thumbnails.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/ric/emuhub/ArchiveHelper.kt app/src/main/java/com/ric/emuhub/MainActivity.kt .github/workflows/add-rar-thumbnails.yml .github/scripts/add_rar_thumbnails.py
          git commit -m "Add RAR support and automatic console thumbnails"
          git push
