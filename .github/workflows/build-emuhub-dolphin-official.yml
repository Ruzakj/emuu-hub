name: Build Emu Hub + Official Dolphin

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/stage-dolphin-runtime.sh'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/ric/emuhub/EmuHubApp.kt'
      - 'app/src/main/java/com/ric/emuhub/DolphinSettingsActivity.kt'
      - '.github/workflows/build-emuhub-dolphin-official.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Emu Hub
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchains
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;27.0.12077973" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Build and stage official Dolphin 2606a runtime AAR
        env:
          DOLPHIN_REF: 2606a
        run: bash scripts/stage-dolphin-runtime.sh

      - name: Verify Dolphin AAR
        run: |
          test -s app/libs/dolphin-runtime.aar
          unzip -l app/libs/dolphin-runtime.aar | grep 'jni/arm64-v8a/libmain.so'
          unzip -l app/libs/dolphin-runtime.aar | grep 'assets/Sys/'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Emu Hub staged cores from latest normal build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-apk.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          rm -rf /tmp/emuhub-normal
          mkdir -p /tmp/emuhub-normal
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n EmuHub-InternalCores-debug -D /tmp/emuhub-normal
          APK=$(find /tmp/emuhub-normal -type f -name '*.apk' | head -1)
          test -n "$APK"
          mkdir -p /tmp/normal-apk
          unzip -q "$APK" -d /tmp/normal-apk
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/normal-apk/lib/arm64-v8a/libmgba_core.so app/src/main/jniLibs/arm64-v8a/
          cp /tmp/normal-apk/lib/arm64-v8a/libfceumm_core.so app/src/main/jniLibs/arm64-v8a/
          cp /tmp/normal-apk/lib/arm64-v8a/libsnes9x_core.so app/src/main/jniLibs/arm64-v8a/
          cp /tmp/normal-apk/lib/arm64-v8a/libpcsx_rearmed_core.so app/src/main/jniLibs/arm64-v8a/
          cp /tmp/normal-apk/lib/arm64-v8a/libppsspp_core.so app/src/main/jniLibs/arm64-v8a/
          cp /tmp/normal-apk/lib/arm64-v8a/libemucore_4k.so app/src/main/jniLibs/arm64-v8a/
          cp -a /tmp/normal-apk/assets/PPSSPP app/src/main/assets/ || true
          cp -a /tmp/normal-apk/assets/ARMSX2 app/src/main/assets/ || true
          cp -a /tmp/normal-apk/assets/builtin-roms app/src/main/assets/ || true

      - name: Build Emu Hub debug APK with embedded Dolphin
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify final APK contains Dolphin + existing engines
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libmain.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libemuhost.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libppsspp_core.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libemucore_4k.so'
          unzip -l "$APK" | grep 'assets/Sys/'

      - name: Upload Emu Hub Dolphin APK
        uses: actions/upload-artifact@v4
        with:
          name: EmuHub-Official-Dolphin-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
