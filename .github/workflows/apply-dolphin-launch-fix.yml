name: Apply Dolphin direct boot fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-dolphin-launch-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Dolphin launcher routing
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_dolphin_launch.py
          git diff --check
          grep -q 'ACTION_MAIN' app/src/main/java/com/ric/emuhub/MainActivity.kt
          grep -q 'AutoStartFile' app/src/main/java/com/ric/emuhub/MainActivity.kt
          grep -q 'org.dolphinemu.dolphinemu' app/src/main/AndroidManifest.xml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/MainActivity.kt app/src/main/AndroidManifest.xml
          git commit -m 'Fix Dolphin external direct boot routing'
          git push
