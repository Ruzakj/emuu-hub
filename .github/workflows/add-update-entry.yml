name: Add Update Entry
on:
  push:
    paths: ['.github/workflows/add-update-entry.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/ric/emuhub/MainActivity.kt')
          s=p.read_text()
          old='''        content.addView(quickRow,LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,dp(76)).apply{topMargin=dp(12)})\n'''
          new='''        content.addView(quickRow,LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,dp(76)).apply{topMargin=dp(12)})\n        content.addView(miniTile("↑","System Update","Check • download • install latest build") { startActivity(Intent(this@MainActivity,UpdateActivity::class.java)) },LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,dp(68)).apply{topMargin=dp(10)})\n'''
          if old not in s: raise SystemExit('quick row anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - run: |
          rm .github/workflows/add-update-entry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/MainActivity.kt .github/workflows/add-update-entry.yml
          git commit -m 'Expose in-app system updater on home dashboard'
          git push