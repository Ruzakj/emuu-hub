name: Console UI Refresh
on:
  push:
    paths:
      - '.github/workflows/console-ui-refresh.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainActivity console UI
        run: python .github/scripts/console_ui_refresh.py
      - name: Commit console UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/MainActivity.kt
          git commit -m 'Refresh home UI as a console dashboard'
          git push
