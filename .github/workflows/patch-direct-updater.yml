name: Patch Direct In-App Updater

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-direct-updater.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace DownloadManager transfer with direct HTTPS
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ric/emuhub/UpdateActivity.kt')
          s = p.read_text()
          start = s.index('    private fun downloadUpdate(asset: ApkAsset) {')
          end = s.index('    private fun verifyDownloadedApk(', start)
          block = r'''    private fun downloadUpdate(asset: ApkAsset) {
        val dir = File(getExternalFilesDir(null), "updates").apply { mkdirs() }
        dir.listFiles()?.forEach { it.deleteRecursively() }
        val apk = File(dir, asset.name.ifBlank { "EmuHub-update.apk" })
        pendingApk = apk
        downloadCancelled = false
        progress.isIndeterminate = false
        progress.max = 100
        progress.progress = 0
        progress.visibility = View.VISIBLE
        action.text = "CANCEL DOWNLOAD"
        action.isEnabled = true
        action.setOnClickListener {
            downloadCancelled = true
            apk.delete()
            pendingApk = null
            progress.visibility = View.GONE
            status.text = "Download cancelled • temporary file cleaned"
            action.text = "CHECK AGAIN"
            action.setOnClickListener { checkUpdate() }
        }
        status.text = "Connecting • ${formatBytes(asset.size)}"
        Thread({ directDownload(asset, apk) }, "emuhub-direct-update").start()
    }

    private fun directDownload(asset: ApkAsset, apk: File) {
        var connection: HttpURLConnection? = null
        try {
            connection = URL(asset.url).openConnection() as HttpURLConnection
            connection.instanceFollowRedirects = true
            connection.connectTimeout = 15_000
            connection.readTimeout = 60_000
            connection.setRequestProperty("User-Agent", "EmuHub-Updater/${BuildConfig.VERSION_NAME}")
            connection.setRequestProperty("Accept", "application/octet-stream")
            val code = connection.responseCode
            require(code in 200..299) { "Download HTTP $code" }
            val serverSize = connection.contentLengthLong.takeIf { it > 0L }
            val total = asset.size.takeIf { it > 0L } ?: serverSize ?: -1L
            apk.parentFile?.mkdirs()
            var downloaded = 0L
            connection.inputStream.buffered(1024 * 1024).use { input ->
                apk.outputStream().buffered(1024 * 1024).use { output ->
                    val buffer = ByteArray(1024 * 1024)
                    while (true) {
                        if (downloadCancelled) throw java.io.InterruptedIOException("cancelled")
                        val count = input.read(buffer)
                        if (count <= 0) break
                        output.write(buffer, 0, count)
                        downloaded += count
                        if (total > 0L) {
                            val pct = ((downloaded * 100L) / total).coerceIn(0L, 100L).toInt()
                            runOnUiThread {
                                progress.progress = pct
                                status.text = "Downloading • $pct% • ${formatBytes(downloaded)} / ${formatBytes(total)}"
                            }
                        } else {
                            runOnUiThread { status.text = "Downloading • ${formatBytes(downloaded)}" }
                        }
                    }
                }
            }
            if (downloadCancelled) return
            verifyDownloadedApk(apk, asset)
            runOnUiThread {
                if (isFinishing || isDestroyed) return@runOnUiThread
                progress.progress = 100
                status.text = "Verified • ${formatBytes(apk.length())} • ready to install"
                action.text = "INSTALL UPDATE"
                action.isEnabled = true
                action.setOnClickListener { installApk(apk) }
                installApk(apk)
            }
        } catch (e: Exception) {
            apk.delete()
            pendingApk = null
            if (!downloadCancelled) runOnUiThread {
                if (isFinishing || isDestroyed) return@runOnUiThread
                progress.visibility = View.GONE
                status.text = "Download failed • ${friendlyError(e)} • temporary file cleaned"
                action.text = "RETRY DOWNLOAD"
                action.isEnabled = true
                action.setOnClickListener { downloadUpdate(asset) }
            }
        } finally {
            connection?.disconnect()
        }
    }

'''
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - name: Verify direct updater
        run: |
          grep -q 'emuhub-direct-update' app/src/main/java/com/ric/emuhub/UpdateActivity.kt
          grep -q 'verifyDownloadedApk' app/src/main/java/com/ric/emuhub/UpdateActivity.kt
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/UpdateActivity.kt
          git commit -m "Use direct HTTPS for reliable in-app updates"
          git push
