name: Apply Fix 307
on:
  push:
    branches:
      - main
    paths:
      - .github/fix307.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/fix307.py
      - name: Commit
        run: |
          rm -f .github/fix307.py .github/workflows/fix-build-307.yml .github/workflows/apply-fix307.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix game title regex compilation"
          git push
