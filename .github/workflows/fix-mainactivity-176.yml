name: Fix MainActivity Syntax
on:
  push:
    paths:
      - '.github/workflows/fix-mainactivity-176.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair accidental block comment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/ric/emuhub/MainActivity.kt')
          s=p.read_text()
          bad='        /* legacy BIOS entry is now inside PS2 Settings */\n        /* \n        quickGrid.addView'
          good='        /* legacy BIOS entry is now inside PS2 Settings */\n        quickGrid.addView'
          if bad not in s:
              raise SystemExit('Expected broken block-comment marker not found')
          p.write_text(s.replace(bad,good,1))
          PY
          rm .github/workflows/fix-mainactivity-176.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/MainActivity.kt .github/workflows/fix-mainactivity-176.yml
          git commit -m 'Fix MainActivity syntax after PS2 settings integration'
          git push