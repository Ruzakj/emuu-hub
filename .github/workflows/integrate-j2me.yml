name: Integrate J2ME Runtime

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/integrate-j2me.yml' ]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install JL-Mod toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "ndk;22.1.7171670"
      - name: Build embedded JL-Mod AARs
        id: jlbuild
        continue-on-error: true
        run: |
          set -uo pipefail
          rm -rf /tmp/jlmod
          git clone --recursive https://github.com/woesss/JL-Mod.git /tmp/jlmod
          cd /tmp/jlmod
          git checkout f723a190c0bdb44b31c3bc0ead6f8665c7ea517d
          git submodule update --init --recursive

          python3 - <<'PY'
          from pathlib import Path
          p=Path('gradle/libs.versions.toml')
          s=p.read_text()
          s=s.replace('kotlin = "2.2.10"', 'kotlin = "2.0.21"')
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/javax/microedition/util/ContextHolder.java')
          s=p.read_text()
          s=s.replace('private static Display display;', 'private static Context emuHubContext;\n\tprivate static Display display;')
          s=s.replace('public static Context getAppContext() {\n\t\treturn EmulatorApplication.getInstance();\n\t}', 'public static void init(Context context) { emuHubContext = context.getApplicationContext(); }\n\n\tpublic static Context getAppContext() {\n\t\treturn emuHubContext != null ? emuHubContext : EmulatorApplication.getInstance();\n\t}')
          p.write_text(s)
          p=Path('app/src/main/java/ru/playsoftware/j2meloader/config/Config.java')
          s=p.read_text()
          s=s.replace('String path = preferences.getString(PREF_EMULATOR_DIR, null);\n\t\tif (path == null) path = Environment.getExternalStorageDirectory() + "/" + appName;', 'String path = Environment.getExternalStorageDirectory() + "/Java";')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('alias(libs.plugins.android.application)', 'alias(libs.plugins.android.library)')
          s=s.replace('        applicationId = "ru.woesss.j2meloader"\n', '')
          s=s.replace('        targetSdk = rootProject.extra["targetSdk"] as Int\n', '')
          s=s.replace('        versionCode = 48\n', '')
          s=s.replace('        versionName = "0.87.1"\n', '')
          s=s.replace('    @Suppress("UnstableApiUsage")\n    androidResources.generateLocaleConfig = true\n\n', '')
          s=s.replace('        minSdk = rootProject.extra["minSdk"] as Int\n', '        minSdk = rootProject.extra["minSdk"] as Int\n        buildConfigField("String", "VERSION_NAME", "\\\"0.89.0-emuhub\\\"")\n')
          s=s.replace('        release {\n            isMinifyEnabled = true\n            isShrinkResources = true\n        }', '        release {\n            isMinifyEnabled = false\n        }')
          s=s.replace('            applicationIdSuffix = ".debug"\n', '')
          start=s.find('    signingConfigs.create("emulator") {')
          if start >= 0:
              end=s.find('\n    buildTypes {', start)
              s=s[:start]+s[end:]
          s=s.replace('            signingConfig = signingConfigs.getByName("emulator")\n', '')
          s=s.replace('            versionNameSuffix = System.getenv("VERSION_SUFFIX")\n', '')
          mid=s.find('        create("midlet") {')
          if mid >= 0:
              depth=0; i=mid
              while i < len(s):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0:
                          s=s[:mid]+s[i+1:]
                          break
                  i+=1
          split=s.find('\n    splits.abi {')
          if split >= 0:
              end=s.find('\n    externalNativeBuild', split)
              s=s[:split]+s[end:]
          av=s.find('\n    applicationVariants.configureEach {')
          if av >= 0:
              end=s.find('\n}\n\nkotlin.compilerOptions', av)
              s=s[:av]+s[end:]
          p.write_text(s)
          PY
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application>
                  <activity android:name="ru.playsoftware.j2meloader.config.ConfigActivity" android:exported="false" android:process=":j2me" android:windowSoftInputMode="stateHidden" />
                  <activity android:name="javax.microedition.shell.MicroActivity" android:exported="false" android:process=":j2me" android:theme="@style/AppTheme.NoActionBar" android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode" />
                  <activity android:name="ru.playsoftware.j2meloader.settings.SettingsActivity" android:exported="false" android:process=":j2me" />
                  <activity android:name="ru.playsoftware.j2meloader.settings.KeyMapperActivity" android:exported="false" android:process=":j2me" />
                  <activity android:name="ru.playsoftware.j2meloader.config.ProfilesActivity" android:exported="false" android:process=":j2me" />
                  <activity android:name="com.nokia.mid.ui.NotificationActivity" android:exported="false" android:process=":j2me" />
              </application>
          </manifest>
          EOF
          chmod +x gradlew
          set +e
          ./gradlew :app:bundleEmulatorReleaseAar :dexlib:bundleReleaseAar --stacktrace > "$GITHUB_WORKSPACE/j2me-build.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then tail -n 400 "$GITHUB_WORKSPACE/j2me-build.log"; exit "$rc"; fi
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/libs
          cp /tmp/jlmod/app/build/outputs/aar/app-emulator-release.aar app/libs/jlmod-runtime.aar
          cp /tmp/jlmod/dexlib/build/outputs/aar/dexlib-release.aar app/libs/jlmod-dexlib.aar
          test -s app/libs/jlmod-runtime.aar
          test -s app/libs/jlmod-dexlib.aar
      - name: Commit failure log
        if: steps.jlbuild.outcome == 'failure'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add j2me-build.log
          git commit -m "Capture JL-Mod integration build failure" || true
          git pull --rebase origin main || true
          git push || true
          exit 1
      - name: Add Java console entry
        if: steps.jlbuild.outcome == 'success'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/ric/emuhub/MainActivity.kt')
          s=p.read_text()
          s=s.replace('Triple("SNES","Snes9x","CORE"),Triple("SWITCH","Eden","EXT")', 'Triple("SNES","Snes9x","CORE"),Triple("JAVA","JL-Mod","INT"),Triple("SWITCH","Eden","EXT")')
          if 'if(item.first=="JAVA")' not in s:
              anchor='''                if(item.first=="PS2"){\n                    isClickable=true;isFocusable=true\n                    setOnClickListener{\n                        status.text=if(Ps2BiosActivity.selectedBios(this@MainActivity)!=null)"PS2 BIOS ready • tap to change" else "PS2 BIOS setup • pilih BIOS dulu"\n                        startActivity(Intent(this@MainActivity,Ps2BiosActivity::class.java))\n                    }\n                }'''
              s=s.replace(anchor, anchor + '''\n                if(item.first=="JAVA"){\n                    isClickable=true;isFocusable=true\n                    setOnClickListener{startActivity(Intent(this@MainActivity,J2meLibraryActivity::class.java))}\n                }''')
          p.write_text(s)
          PY
      - name: Commit embedded runtime
        if: steps.jlbuild.outcome == 'success'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/libs/jlmod-runtime.aar app/libs/jlmod-dexlib.aar app/src/main/java/com/ric/emuhub/MainActivity.kt
          git commit -m "Isolate embedded J2ME runtime process" || exit 0
          git pull --rebase origin main
          git push
