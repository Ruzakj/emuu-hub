name: Integrate J2ME Runtime

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/integrate-j2me.yml' ]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install JL-Mod toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "ndk;22.1.7171670"

      - name: Build embedded JL-Mod AARs
        run: |
          set -euxo pipefail
          rm -rf /tmp/jlmod
          git clone --recursive https://github.com/woesss/JL-Mod.git /tmp/jlmod
          cd /tmp/jlmod
          git checkout f723a190c0bdb44b31c3bc0ead6f8665c7ea517d
          git submodule update --init --recursive

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/javax/microedition/util/ContextHolder.java')
          s=p.read_text()
          s=s.replace('private static Display display;', 'private static Context emuHubContext;\n\tprivate static Display display;')
          s=s.replace('public static Context getAppContext() {\n\t\treturn EmulatorApplication.getInstance();\n\t}', 'public static void init(Context context) { emuHubContext = context.getApplicationContext(); }\n\n\tpublic static Context getAppContext() {\n\t\treturn emuHubContext != null ? emuHubContext : EmulatorApplication.getInstance();\n\t}')
          p.write_text(s)
          p=Path('app/src/main/java/ru/playsoftware/j2meloader/config/Config.java')
          s=p.read_text()
          s=s.replace('String path = preferences.getString(PREF_EMULATOR_DIR, null);\n\t\tif (path == null) path = Environment.getExternalStorageDirectory() + "/" + appName;', 'String path = Environment.getExternalStorageDirectory() + "/Java";')
          p.write_text(s)
          PY

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application>
                  <activity android:name="ru.playsoftware.j2meloader.config.ConfigActivity" android:exported="false" android:windowSoftInputMode="stateHidden" />
                  <activity android:name="javax.microedition.shell.MicroActivity" android:exported="false" android:theme="@style/AppTheme.NoActionBar" android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode" android:process=":midlet" />
                  <activity android:name="ru.playsoftware.j2meloader.settings.SettingsActivity" android:exported="false" />
                  <activity android:name="ru.playsoftware.j2meloader.settings.KeyMapperActivity" android:exported="false" />
                  <activity android:name="ru.playsoftware.j2meloader.config.ProfilesActivity" android:exported="false" />
                  <activity android:name="com.nokia.mid.ui.NotificationActivity" android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > app/build.gradle.kts <<'EOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget
          plugins {
              alias(libs.plugins.android.library)
              alias(libs.plugins.kotlin.android)
          }
          android {
              compileSdk = rootProject.extra["compileSdk"] as Int
              ndkVersion = rootProject.extra["ndkVersion"] as String
              namespace = "ru.playsoftware.j2meloader"
              defaultConfig {
                  minSdk = rootProject.extra["minSdk"] as Int
                  resValue("string", "app_name", "Java")
                  resValue("string", "app_center", "")
                  resValue("string", "fingerprint", "")
              }
              buildFeatures { viewBinding = true; prefab = true; buildConfig = true }
              buildTypes { release { isMinifyEnabled = false } }
              flavorDimensions += "default"
              productFlavors { create("emulator") { buildConfigField("boolean", "FULL_EMULATOR", "true") } }
              externalNativeBuild.ndkBuild.path("src/main/cpp/Android.mk")
              compileOptions { targetCompatibility = JavaVersion.VERSION_17; sourceCompatibility = JavaVersion.VERSION_17 }
          }
          kotlin.compilerOptions.jvmTarget.set(JvmTarget.JVM_17)
          dependencies {
              implementation(projects.dexlib)
              implementation(libs.androidx.activity.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.androidx.arch.core.common)
              implementation(libs.androidx.collection)
              implementation(libs.androidx.concurrent.futures)
              implementation(libs.androidx.constraintlayout)
              implementation(libs.androidx.coordinatorlayout)
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.documentfile)
              implementation(libs.androidx.fragment.ktx)
              implementation(libs.androidx.lifecycle.common)
              implementation(libs.androidx.lifecycle.livedata.ktx)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.multidex)
              implementation(libs.androidx.preference.ktx)
              implementation(libs.androidx.recyclerview)
              annotationProcessor(libs.androidx.room.compiler)
              implementation(libs.androidx.room.runtime)
              implementation(libs.androidx.room.rxjava2)
              implementation(libs.androidx.transition)
              annotationProcessor(libs.google.auto.service)
              compileOnly(libs.google.auto.service.annotations)
              implementation(libs.google.gson)
              implementation(libs.google.material)
              implementation(libs.google.oboe)
              implementation(libs.acra.http)
              implementation(libs.ambilwarna)
              implementation(libs.donations)
              implementation(libs.ffmpeg.mobile)
              implementation(libs.filepicker)
              implementation(libs.pngj)
              implementation(libs.rx.android)
          }
          EOF

          chmod +x gradlew
          ./gradlew :app:bundleEmulatorReleaseAar :dexlib:bundleReleaseAar --stacktrace
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/libs
          cp /tmp/jlmod/app/build/outputs/aar/app-emulator-release.aar app/libs/jlmod-runtime.aar
          cp /tmp/jlmod/dexlib/build/outputs/aar/dexlib-release.aar app/libs/jlmod-dexlib.aar
          test -s app/libs/jlmod-runtime.aar
          test -s app/libs/jlmod-dexlib.aar

      - name: Add Java console entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/ric/emuhub/MainActivity.kt')
          s=p.read_text()
          s=s.replace('Triple("SNES","Snes9x","CORE"),Triple("SWITCH","Eden","EXT")', 'Triple("SNES","Snes9x","CORE"),Triple("JAVA","JL-Mod","INT"),Triple("SWITCH","Eden","EXT")')
          if 'if(item.first=="JAVA")' not in s:
              anchor='''                if(item.first=="PS2"){\n                    isClickable=true;isFocusable=true\n                    setOnClickListener{\n                        status.text=if(Ps2BiosActivity.selectedBios(this@MainActivity)!=null)"PS2 BIOS ready • tap to change" else "PS2 BIOS setup • pilih BIOS dulu"\n                        startActivity(Intent(this@MainActivity,Ps2BiosActivity::class.java))\n                    }\n                }'''
              s=s.replace(anchor, anchor + '''\n                if(item.first=="JAVA"){\n                    isClickable=true;isFocusable=true\n                    setOnClickListener{startActivity(Intent(this@MainActivity,J2meLibraryActivity::class.java))}\n                }''')
          p.write_text(s)
          PY

      - name: Commit embedded runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/libs/jlmod-runtime.aar app/libs/jlmod-dexlib.aar app/src/main/java/com/ric/emuhub/MainActivity.kt
          git commit -m "Embed JL-Mod runtime for J2ME" || exit 0
          git push
