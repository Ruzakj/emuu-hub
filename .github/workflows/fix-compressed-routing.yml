name: Fix Compressed Game Routing

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-compressed-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix_compressed_routing.py
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-compressed-routing.yml scripts/fix_compressed_routing.py
          git add app/src/main/java/com/ric/emuhub/MainActivity.kt .github/workflows/fix-compressed-routing.yml scripts/fix_compressed_routing.py
          git commit -m "Fix compressed ROM selection and PS2 routing"
          git push
