name: Fix compressed routing

on:
  push:
    paths:
      - '.github/workflows/fix-compressed-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch compressed routing
        run: python .github/scripts/fix-compressed-routing.py
      - name: Remove temporary patch files
        run: |
          rm -f .github/workflows/fix-compressed-routing.yml
          rm -f .github/scripts/fix-compressed-routing.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix compressed game routing and BIOS resume"
          git push
