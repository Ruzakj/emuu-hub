name: Migrate Dolphin to external launcher

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[migrate-dolphin-external]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace embedded Dolphin with Switch-style external routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch target: {label}')
              return text.replace(old, new)

          p = Path('app/src/main/java/com/ric/emuhub/MainActivity.kt')
          s = p.read_text()

          s = rep(s,
          '        private val SWITCH = setOf("xci","nsp","nro")\n        private val ARCHIVES = ArchiveHelper.ARCHIVE_EXTENSIONS\n        private val RECOGNIZED = INTERNAL + SWITCH + ARCHIVES\n        private val EDEN_PACKAGES = listOf("com.miHoYo.Yuanshen","com.miHoYo.Yunashen","com.miHoYo.Yuanshen.nightly","dev.eden.eden_emulator","dev.eden.eden_nightly")',
          '        private val SWITCH = setOf("xci","nsp","nro")\n        private val GC_WII = setOf("gcm","gcz","rvz","wbfs","wia","wad","dol","elf")\n        private val ARCHIVES = ArchiveHelper.ARCHIVE_EXTENSIONS\n        private val RECOGNIZED = INTERNAL + SWITCH + GC_WII + ARCHIVES\n        private val EDEN_PACKAGES = listOf("com.miHoYo.Yuanshen","com.miHoYo.Yunashen","com.miHoYo.Yuanshen.nightly","dev.eden.eden_emulator","dev.eden.eden_nightly")\n        private val DOLPHIN_PACKAGES = listOf("org.dolphinemu.dolphinemu","org.dolphinemu.dolphinemu.dev","org.dolphinemu.mmjr","org.dolphinemu.mmjr2")',
          'core sets')

          s = rep(s,
          'arrayOf("JAVA","JL-Mod","J"),arrayOf("SWITCH","Eden","▰"))',
          'arrayOf("JAVA","JL-Mod","J"),arrayOf("GC/WII","External","◉"),arrayOf("SWITCH","Eden","▰"))',
          'console strip')

          s = rep(s,
          '            "ps1" in t || "psx" in t || "psone" in t || h.contains("playstation 1")->"PS1"\n            else->null',
          '            "ps1" in t || "psx" in t || "psone" in t || h.contains("playstation 1")->"PS1"\n            "gamecube" in t || "ngc" in t || "wii" in t || h.contains("game cube")->"GC/WII"\n            else->null',
          'folder hint')

          s = rep(s,
          '            "sfc","smc"->"SNES"\n            "xci","nsp","nro"->"SWITCH"',
          '            "sfc","smc"->"SNES"\n            in GC_WII->"GC/WII"\n            "xci","nsp","nro"->"SWITCH"',
          'inferred console')

          s = rep(s,
          'private fun consoleRank(g:GameEntry)=when(inferredConsole(g)){"PSP"->0;"PS1"->1;"PS2"->2;"GBA"->3;"NES"->4;"SNES"->5;"SWITCH"->6;"DISC"->7;"ARCHIVE"->8;else->99}',
          'private fun consoleRank(g:GameEntry)=when(inferredConsole(g)){"PSP"->0;"PS1"->1;"PS2"->2;"GBA"->3;"NES"->4;"SNES"->5;"GC/WII"->6;"SWITCH"->7;"DISC"->8;"ARCHIVE"->9;else->99}',
          'console rank')

          s = rep(s,
          '        "SNES"->"SNES • SNES9X"\n        "SWITCH"->"NINTENDO SWITCH • EDEN"',
          '        "SNES"->"SNES • SNES9X"\n        "GC/WII"->"GAMECUBE / WII • EXTERNAL DOLPHIN"\n        "SWITCH"->"NINTENDO SWITCH • EDEN"',
          'console group')

          s = rep(s,
          'val filters=listOf("ALL","PSP","PS1","PS2","GBA","NES","SNES","SWITCH","JAVA")',
          'val filters=listOf("ALL","PSP","PS1","PS2","GBA","NES","SNES","GC/WII","SWITCH","JAVA")',
          'filters')

          s = rep(s,
          '"PSP"->"P";"PS1"->"1";"PS2"->"2";"GBA"->"G";"NES"->"N";"SNES"->"S";"SWITCH"->"▰";',
          '"PSP"->"P";"PS1"->"1";"PS2"->"2";"GBA"->"G";"NES"->"N";"SNES"->"S";"GC/WII"->"◉";"SWITCH"->"▰";',
          'glyph')

          s = rep(s,
          '"PSP"->"PPSSPP";"PS1"->"PCSX";"PS2"->"ARMSX2";"GBA"->"mGBA";"NES"->"FCEUmm";"SNES"->"Snes9x";"SWITCH"->"EDEN";',
          '"PSP"->"PPSSPP";"PS1"->"PCSX";"PS2"->"ARMSX2";"GBA"->"mGBA";"NES"->"FCEUmm";"SNES"->"Snes9x";"GC/WII"->"EXTERNAL";"SWITCH"->"EDEN";',
          'engine label')

          s = rep(s,
          'private fun systemCode(e:String)=when(e){"gb","gbc","gba"->"GBA";"nes"->"NES";"sfc","smc"->"SNES";"bin","cue"->"PS1";"chd"->"CHD";"ecm"->"ECM";"iso"->"ISO";"cso"->"PSP";"xci","nsp","nro"->"NSW";',
          'private fun systemCode(e:String)=when(e){"gb","gbc","gba"->"GBA";"nes"->"NES";"sfc","smc"->"SNES";"bin","cue"->"PS1";"chd"->"CHD";"ecm"->"ECM";"iso"->"ISO";"cso"->"PSP";in GC_WII->"GCW";"xci","nsp","nro"->"NSW";',
          'system code')

          s = rep(s,
          'private fun systemColor(e:String)=when(e){"xci","nsp","nro"->0xFF243847.toInt();',
          'private fun systemColor(e:String)=when(e){in GC_WII->0xFF31413F.toInt();"xci","nsp","nro"->0xFF243847.toInt();',
          'system color')

          s = rep(s,
          '"GBA"->"GBA";"NES"->"NES";"SNES"->"SNES";"SWITCH"->"NSW";',
          '"GBA"->"GBA";"NES"->"NES";"SNES"->"SNES";"GC/WII"->"GCW";"SWITCH"->"NSW";',
          'system code for')

          s = rep(s,
          '"GBA"->"Game Boy • mGBA";"NES"->"NES • FCEUmm";"SNES"->"SNES • Snes9x";"SWITCH"->"Nintendo Switch • Eden";',
          '"GBA"->"Game Boy • mGBA";"NES"->"NES • FCEUmm";"SNES"->"SNES • Snes9x";"GC/WII"->"GameCube / Wii • external emulator";"SWITCH"->"Nintendo Switch • Eden";',
          'system name for')

          s = rep(s,
          '"GBA"->0xFF2D4138.toInt();"NES"->0xFF493237.toInt();"SNES"->0xFF39364A.toInt();"SWITCH"->0xFF243847.toInt();',
          '"GBA"->0xFF2D4138.toInt();"NES"->0xFF493237.toInt();"SNES"->0xFF39364A.toInt();"GC/WII"->0xFF31413F.toInt();"SWITCH"->0xFF243847.toInt();',
          'system color for')

          s = rep(s,
          '            "GBA","NES","SNES"->copyAndLaunchInternal(uri,g.name,g.ext,null)\n            "SWITCH"->launchEden(uri)',
          '            "GBA","NES","SNES"->copyAndLaunchInternal(uri,g.name,g.ext,null)\n            "GC/WII"->launchDolphinExternal(uri,g.name)\n            "SWITCH"->launchEden(uri)',
          'library route')

          s = rep(s,
          'private fun openLibraryGame(uri:Uri,name:String,ext:String){when{ext in ARCHIVES->openArchive(uri,name);ext in SWITCH->launchEden(uri);',
          'private fun openLibraryGame(uri:Uri,name:String,ext:String){when{ext in ARCHIVES->openArchive(uri,name);ext in SWITCH->launchEden(uri);ext in GC_WII->launchDolphinExternal(uri,name);',
          'direct route')

          s = rep(s,
          'private fun showIsoChooser(uri:Uri,name:String){AlertDialog.Builder(this).setTitle("Open ISO with").setItems(arrayOf("PlayStation 1 • PCSX-ReARMed","PSP • PPSSPP","PlayStation 2 • ARMSX2 Vulkan")){_,which->when(which){0->copyAndLaunchInternal(uri,name,"iso","pcsx");1->showPspResolutionChooser(uri,name,"iso");else->launchPs2OrSetup(uri,name)}}.setNegativeButton("Batal",null).show()}',
          'private fun showIsoChooser(uri:Uri,name:String){AlertDialog.Builder(this).setTitle("Open ISO with").setItems(arrayOf("PlayStation 1 • PCSX-ReARMed","PSP • PPSSPP","PlayStation 2 • ARMSX2 Vulkan","GameCube / Wii • External emulator")){_,which->when(which){0->copyAndLaunchInternal(uri,name,"iso","pcsx");1->showPspResolutionChooser(uri,name,"iso");2->launchPs2OrSetup(uri,name);else->launchDolphinExternal(uri,name)}}.setNegativeButton("Batal",null).show()}',
          'iso chooser')

          s = rep(s,
          '            "ecm"->decodeExtractedEcm(session,rom)\n            else->launchTempInternalFile(rom.file,coreIdFor(rom.ext),rom.displayName,session.root)',
          '            "ecm"->decodeExtractedEcm(session,rom)\n            in GC_WII->{pendingArchiveSession=session.root;launchDolphinExternal(Uri.fromFile(rom.file),rom.displayName)}\n            else->launchTempInternalFile(rom.file,coreIdFor(rom.ext),rom.displayName,session.root)',
          'archive route')

          s = rep(s,
          '        "sfc","smc"->"SNES"\n        "xci","nsp","nro"->"SWITCH"',
          '        "sfc","smc"->"SNES"\n        in GC_WII->"GC/WII"\n        "xci","nsp","nro"->"SWITCH"',
          'archive label')

          s = rep(s,
          '    private fun launchEden(uri:Uri){',
          '''    private fun launchDolphinExternal(uri:Uri,name:String){
        val pkg=DOLPHIN_PACKAGES.firstOrNull{packageManager.getLaunchIntentForPackage(it)!=null}?:run{
            Toast.makeText(this,"Emulator GameCube/Wii eksternal tidak terdeteksi. Install Dolphin atau fork yang kompatibel.",Toast.LENGTH_LONG).show();return
        }
        val directPath=directGameFile(uri)?.absolutePath
        val attempts=listOf(
            Intent(Intent.ACTION_VIEW).apply{setDataAndType(uri,"application/octet-stream");setPackage(pkg);addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);clipData=ClipData.newRawUri("GameCube/Wii ROM",uri)},
            packageManager.getLaunchIntentForPackage(pkg)?.apply{putExtra("AutoStartFile",directPath?:uri.toString());putExtra("romPath",directPath?:uri.toString());putExtra("romName",name)}
        ).filterNotNull()
        for(intent in attempts){
            try{startActivity(intent);status.text="GameCube/Wii • external launcher";return}catch(_:Exception){}
        }
        Toast.makeText(this,"Emulator terdeteksi tetapi ROM tidak bisa dikirim langsung. Buka emulator lalu pilih file game.",Toast.LENGTH_LONG).show()
        packageManager.getLaunchIntentForPackage(pkg)?.let{runCatching{startActivity(it)}}
    }

    private fun launchEden(uri:Uri){''',
          'external launcher function')

          s = rep(s,
          'private fun systemName(e:String)=when(e){"gb","gbc","gba"->"Game Boy • mGBA";"nes"->"Nintendo Entertainment System • FCEUmm";"sfc","smc"->"Super Nintendo • Snes9x";"bin","cue"->"PlayStation • PCSX-ReARMed";"chd"->"PlayStation / PS2 • choose engine";"ecm"->"PlayStation • ECM auto decode";"iso"->"PS1 / PSP / PS2 • choose engine";"cso"->"PSP • PPSSPP";"xci","nsp","nro"->"Nintendo Switch • Eden Optimized";',
          'private fun systemName(e:String)=when(e){"gb","gbc","gba"->"Game Boy • mGBA";"nes"->"Nintendo Entertainment System • FCEUmm";"sfc","smc"->"Super Nintendo • Snes9x";"bin","cue"->"PlayStation • PCSX-ReARMed";"chd"->"PlayStation / PS2 • choose engine";"ecm"->"PlayStation • ECM auto decode";"iso"->"PS1 / PSP / PS2 / GC-Wii • choose engine";"cso"->"PSP • PPSSPP";in GC_WII->"GameCube / Wii • external emulator";"xci","nsp","nro"->"Nintendo Switch • Eden Optimized";',
          'system name')

          s = rep(s,
          'if(requestCode==REQUEST_ROM){val uri=data?.data?:return;val name=displayName(uri)?:"ROM";val ext=extension(name);when{ext in ARCHIVES->openArchive(uri,name);ext in SWITCH->launchEden(uri);ext=="ecm"',
          'if(requestCode==REQUEST_ROM){val uri=data?.data?:return;val name=displayName(uri)?:"ROM";val ext=extension(name);when{ext in ARCHIVES->openArchive(uri,name);ext in SWITCH->launchEden(uri);ext in GC_WII->launchDolphinExternal(uri,name);ext=="ecm"',
          'picker route')

          p.write_text(s)

          # Android 11+ package visibility for external GameCube/Wii emulators.
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '        <package android:name="dev.eden.eden_nightly" />\n'
          extra = marker + '        <package android:name="org.dolphinemu.dolphinemu" />\n        <package android:name="org.dolphinemu.dolphinemu.dev" />\n        <package android:name="org.dolphinemu.mmjr" />\n        <package android:name="org.dolphinemu.mmjr2" />\n'
          if 'org.dolphinemu.dolphinemu' not in s:
              s = rep(s, marker, extra, 'manifest queries')
          p.write_text(s)

          # Debug build: remove embedded Ishiiruka staging and assertions.
          p = Path('.github/workflows/build-apk.yml')
          s = p.read_text()
          s = re.sub(r'\n      - name: Stage embedded Ishiiruka 3\.6\.4-r1\n        run: bash scripts/stage-ishiiruka-embedded\.sh\n', '\n', s)
          s = s.replace('          test -s embedded/ishiiruka/src/main/jniLibs/arm64-v8a/libmain.so\n','')
          s = s.replace('          unzip -l "$APK" | grep \'lib/arm64-v8a/libmain.so\'\n','')
          s = s.replace('name: EmuHub-Ishiiruka-Embedded-debug','name: EmuHub-External-GCWii-debug')
          p.write_text(s)

          # Stable release: stop downloading/packing/verifying Dolphin internally.
          p = Path('.github/workflows/release-apk.yml')
          s = p.read_text()
          s = s.replace('      - name: Download internal libretro cores including Dolphin','      - name: Download internal libretro cores')
          s = s.replace('          fetch_core dolphin libdolphin_core.so\n          test -s app/src/main/jniLibs/arm64-v8a/libdolphin_core.so\n','')
          s = re.sub(r'\n      - name: Stage Dolphin Sys runtime zip\n.*?(?=\n      - name: Stage PPSSPP runtime assets)', '\n', s, flags=re.S)
          s = s.replace('      - name: Prepare thin app shell but keep Dolphin internal','      - name: Prepare thin app shell')
          s = s.replace('          test -s app/src/main/jniLibs/arm64-v8a/libdolphin_core.so\n          test -s app/src/main/assets/Dolphin/Sys.zip\n','')
          s = s.replace('      - name: Verify signed APK contains Dolphin core and runtime zip','      - name: Verify signed APK')
          for line in [
              '          unzip -l "$APK" | grep -F "lib/arm64-v8a/libdolphin_core.so"\n',
              '          unzip -l "$APK" | grep -F "assets/Dolphin/Sys.zip"\n',
              '          unzip -p "$APK" assets/Dolphin/Sys.zip > /tmp/DolphinSys.zip\n',
              '          test -s /tmp/DolphinSys.zip\n',
              "          unzip -l /tmp/DolphinSys.zip | grep -F 'GC/font_western.bin'\n",
              "          unzip -l /tmp/DolphinSys.zip | grep -F 'GC/dsp_rom.bin'\n",
              "          unzip -l /tmp/DolphinSys.zip | grep -F 'GC/dsp_coef.bin'\n",
          ]:
              s = s.replace(line,'')
          s = s.replace('          echo "Release $TAG contains internal Dolphin and is ready for in-app update."','          echo "Release $TAG uses external GameCube/Wii routing and is ready for in-app update."')
          p.write_text(s)
          PY

          rm -f scripts/stage-ishiiruka-embedded.sh \
                .github/workflows/fix-ishiiruka-libcpp.yml \
                .github/workflows/fix-ishiiruka-startup-fc.yml \
                .build-trigger-ishiiruka-20260908 \
                .build-trigger-ishiiruka-jni-20260909

          echo 'Residual Dolphin/Ishiiruka references after migration:'
          grep -RniE 'ishiiruka|libdolphin_core|assets/Dolphin|embedded Dolphin|internal Dolphin' \
            app .github/workflows scripts 2>/dev/null || true

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Replace embedded Dolphin with external GC/Wii routing'
          git push
