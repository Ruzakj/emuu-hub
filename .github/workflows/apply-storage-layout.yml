name: Apply Emu Hub Storage Layout

on:
  push:
    paths:
      - '.github/workflows/apply-storage-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch emulator storage paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old}")
              p.write_text(s.replace(old, new))

          replace(
              'app/src/main/java/com/ric/emuhub/GameActivity.kt',
              'val systemRoot = File(filesDir, "system").apply { mkdirs() }',
              'val systemRoot = StoragePaths.systemDir(this)'
          )
          replace(
              'app/src/main/java/com/ric/emuhub/GameActivity.kt',
              'val saveDir = File(filesDir, "saves").apply { mkdirs() }',
              'val saveDir = StoragePaths.savesDir(this)'
          )
          replace(
              'app/src/main/java/com/ric/emuhub/GameActivity.kt',
              'stateFile = File(saveDir, "${coreId}_${safeStateKey(romName)}_slot0.state")',
              'stateFile = File(StoragePaths.statesDir(this), "${coreId}_${safeStateKey(romName)}_slot0.state")'
          )
          replace(
              'app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt',
              'val dataRoot = File(filesDir, "ps2").apply { mkdirs() }; val resourcesDir = File(dataRoot, "resources")',
              'val dataRoot = StoragePaths.ps2Root(this); val resourcesDir = File(dataRoot, "resources")'
          )
          replace(
              'app/src/main/java/com/ric/emuhub/Ps2BiosActivity.kt',
              'fun biosDir(activity: Activity): File = File(activity.filesDir,"ps2/bios").apply{mkdirs()}',
              'fun biosDir(activity: Activity): File = StoragePaths.ps2BiosDir(activity)'
          )
          replace(
              'app/src/main/java/com/ric/emuhub/EmuHubApp.kt',
              'super.onCreate()\n\n        runCatching { File(cacheDir, "ps2roms").deleteRecursively() }',
              'super.onCreate()\n\n        runCatching { StoragePaths.ensureLayout(this) }\n        runCatching { File(cacheDir, "ps2roms").deleteRecursively() }'
          )
          PY

      - name: Commit storage path migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ric/emuhub/GameActivity.kt \
                  app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt \
                  app/src/main/java/com/ric/emuhub/Ps2BiosActivity.kt \
                  app/src/main/java/com/ric/emuhub/EmuHubApp.kt
          if git diff --cached --quiet; then
            echo "No storage path changes needed"
            exit 0
          fi
          git commit -m "Store emulator data under emu-hub"
          git push
