name: Fix PS2 Quick Tune LayoutParams

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-ps2-scroll-layoutparams.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ScrollView child layout params
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt')
          s = p.read_text()
          old = 'addView(panel, ScrollView.LayoutParams('
          new = 'addView(panel, ViewGroup.LayoutParams('
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'EE Cycle Skip' app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt
          grep -q 'addView(panel, ViewGroup.LayoutParams' app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt
          git commit -m "Fix PS2 Quick Tune ScrollView layout params"
          git push
