name: Fix PS2 Manual Settings Runtime
on:
  push:
    paths: ['.github/workflows/fix-ps2-manual-settings-runtime.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt')
          s=p.read_text()
          s=s.replace('NativeApp.setSetting("EmuCore", "EnableThreadPinning", "bool", "false")', 'NativeApp.setSetting("EmuCore", "EnableThreadPinning", "bool", (profile.affinity == 7).toString())')
          s=s.replace('status.text = if (biosOnly) "PS2 • boot BIOS" else "PS2 • Vulkan 2x • Z9X HEAVY"; trace(if (biosOnly)', 'val activeProfile = Ps2Settings.load(this)\n        status.text = if (biosOnly) "PS2 • boot BIOS" else "PS2 • Vulkan ${activeProfile.upscale}x • ${activeProfile.preset.uppercase()} • EE ${activeProfile.eeRate} • SKIP ${activeProfile.eeSkip}"; trace(if (biosOnly)')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt
          git commit -m 'Apply PS2 manual settings to native runtime'
          git push
