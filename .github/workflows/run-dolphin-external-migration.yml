name: Run Dolphin external routing migration

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run-dolphin-external-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply source migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/migrate_dolphin_external.py

          # GitHub Actions token cannot modify workflow files in this repo.
          # Keep workflow cleanup for the authenticated repo connection instead.
          git checkout -- \
            .github/workflows/build-apk.yml \
            .github/workflows/release-apk.yml

          rm -f \
            scripts/stage-ishiiruka-embedded.sh \
            .build-trigger-ishiiruka-20260908 \
            .build-trigger-ishiiruka-jni-20260909

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app scripts .build-trigger-ishiiruka-20260908 .build-trigger-ishiiruka-jni-20260909 2>/dev/null || git add app scripts
          git diff --cached --check
          git commit -m 'Replace embedded Dolphin with external GC/Wii routing'
          git push
