name: Patch Dolphin Libretro Assets

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-dolphin-libretro-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Dolphin Sys runtime marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/ric/emuhub/GameActivity.kt')
          s=p.read_text()
          s=s.replace('if(File(target,"GC/font_ansi.bin").isFile) runCatching{marker.writeText("1")}', 'if(File(target,"GC/font_western.bin").isFile && File(target,"GC/dsp_rom.bin").isFile && File(target,"GC/dsp_coef.bin").isFile) runCatching{marker.writeText("1")}')
          p.write_text(s)
          PY
      - name: Validate patch
        run: |
          ! grep -q 'GC/font_ansi.bin' app/src/main/java/com/ric/emuhub/GameActivity.kt
          grep -q 'GC/font_western.bin' app/src/main/java/com/ric/emuhub/GameActivity.kt
          grep -q 'GC/dsp_rom.bin' app/src/main/java/com/ric/emuhub/GameActivity.kt
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/GameActivity.kt
          git diff --cached --quiet || git commit -m "Fix Dolphin libretro Sys runtime marker"
          git push
