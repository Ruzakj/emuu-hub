name: Patch Dolphin Libretro Assets

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-dolphin-libretro-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Dolphin Sys runtime installer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/ric/emuhub/GameActivity.kt')
          s=p.read_text()
          s=s.replace('if (coreId == "ppsspp") installPpssppAssets(systemRoot)','if (coreId == "ppsspp") installPpssppAssets(systemRoot)\n        if (coreId == "dolphin") installDolphinAssets(systemRoot)')
          marker='    private fun installPpssppAssets(root:File){'
          fn='''    private fun installDolphinAssets(root:File){
        val target=File(root,"dolphin-emu/Sys")
        val marker=File(target,".emuhub_dolphin_sys_v1")
        if(marker.exists())return
        target.mkdirs()
        copyAssetTree("Dolphin/Sys",target)
        if(File(target,"GC/font_ansi.bin").isFile) runCatching{marker.writeText("1")}
    }

'''
          if 'installDolphinAssets' not in s[s.find(marker):]:
              s=s.replace(marker,fn+marker)
          p.write_text(s)
          PY
      - name: Validate patch
        run: |
          grep -q 'installDolphinAssets(systemRoot)' app/src/main/java/com/ric/emuhub/GameActivity.kt
          grep -q 'dolphin-emu/Sys' app/src/main/java/com/ric/emuhub/GameActivity.kt
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/ric/emuhub/GameActivity.kt
          git diff --cached --quiet || git commit -m "Install Dolphin libretro Sys assets internally"
          git push
