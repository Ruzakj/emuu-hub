name: Patch Dolphin Direct Surface

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-dolphin-direct-surface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply direct surface patch
        run: python3 tools/patch_dolphin_direct_surface.py
      - name: Verify patch
        run: |
          git diff --check
          grep -q 'Dolphin window surface created' app/src/main/cpp/emuhost.cpp
          grep -q 'eglSwapBuffers(eglDisplay,eglSurface)' app/src/main/cpp/emuhost.cpp
          grep -q 'setSurface(surface: android.view.Surface?)' app/src/main/java/com/ric/emuhub/core/NativeBridge.kt
          grep -q 'launchDolphinDirectSurface' app/src/main/java/com/ric/emuhub/GameActivity.kt
          test "$(grep -c 'private fun runDolphin()' app/src/main/java/com/ric/emuhub/GameActivity.kt)" -eq 1
      - name: Commit direct surface renderer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/cpp/emuhost.cpp app/src/main/java/com/ric/emuhub/GameActivity.kt app/src/main/java/com/ric/emuhub/core/NativeBridge.kt
          git commit -m 'Render Dolphin directly to Android Surface'
          git push origin main
