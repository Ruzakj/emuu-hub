name: Fix Ishiiruka Startup FC

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-ishiiruka-startup-fc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Ishiiruka native core only when GC/Wii module launches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/stage-ishiiruka-embedded.sh')
          s = p.read_text()

          old = '''        try{\\n            val clazz=Class.forName("org.dolphinemu.dolphinemu.activities.EmulationActivity")\\n            trace.edit().putString("stage","activity_intent_dispatched").commit()'''
          new = '''        try{\\n            trace.edit().putString("stage","native_load").commit()\\n            System.loadLibrary("main")\\n            trace.edit().putString("stage","native_load_ok").commit()\\n            val clazz=Class.forName("org.dolphinemu.dolphinemu.activities.EmulationActivity")\\n            trace.edit().putString("stage","activity_intent_dispatched").commit()'''

          if old not in s:
              raise SystemExit('Ishiiruka launcher insertion point not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git diff --check
          grep -q 'System.loadLibrary("main")' scripts/stage-ishiiruka-embedded.sh
          grep -q 'putString("stage","native_load_ok")' scripts/stage-ishiiruka-embedded.sh

      - name: Commit JNI load-order fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/stage-ishiiruka-embedded.sh
          git commit -m "fix: load Ishiiruka JNI before embedded activity"
          git push
