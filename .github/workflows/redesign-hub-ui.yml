name: Redesign Hub UI

on:
  push:
    paths:
      - '.github/workflows/redesign-hub-ui.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply redesign patch
        run: python3 .github/scripts/redesign_ui.py
      - name: Commit redesign
        run: |
          rm .github/workflows/redesign-hub-ui.yml
          rm .github/scripts/redesign_ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ric/emuhub/MainActivity.kt .github/workflows/redesign-hub-ui.yml .github/scripts/redesign_ui.py
          git commit -m "Redesign Emu Hub as a polished game dashboard"
          git push
