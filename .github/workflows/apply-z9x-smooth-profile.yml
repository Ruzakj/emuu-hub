name: Apply Lightweight Library Patch
on:
  push:
    paths:
      - '.github/workflows/apply-z9x-smooth-profile.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: |
          python3 .github/patch_light_ui.py
          git show 8ba30639d4cd01bf45bb9c1cfd5310a055b9c0b4:.github/workflows/apply-z9x-smooth-profile.yml > .github/workflows/apply-z9x-smooth-profile.yml
          rm -f .github/patch_light_ui.py .github/workflows/patch-light-ui-title.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Lighten library UI and normalize game titles"
          git push
