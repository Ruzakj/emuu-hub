name: Publish Stable In-App Update

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (must increase every release, e.g. 4)'
        required: true
        type: string
      version_name:
        description: 'Visible version, e.g. 0.4.0'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: false
        default: 'Emu Hub update'
        type: string
      thin_shell:
        description: 'Exclude reusable libretro cores + PPSSPP assets (only after an Engine Pack capable release is installed)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  EMUHUB_VERSION_CODE: ${{ inputs.version_code }}
  EMUHUB_VERSION_NAME: ${{ inputs.version_name }}
  EMUHUB_KEYSTORE_PATH: /tmp/emuhub-release.jks
  EMUHUB_KEYSTORE_PASSWORD: ${{ secrets.EMUHUB_KEYSTORE_PASSWORD }}
  EMUHUB_KEY_ALIAS: ${{ secrets.EMUHUB_KEY_ALIAS }}
  EMUHUB_KEY_PASSWORD: ${{ secrets.EMUHUB_KEY_PASSWORD }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Validate stable signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.EMUHUB_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Missing EMUHUB_KEYSTORE_BASE64'; exit 1; }
          test -n "$EMUHUB_KEYSTORE_PASSWORD" || { echo 'Missing EMUHUB_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$EMUHUB_KEY_ALIAS" || { echo 'Missing EMUHUB_KEY_ALIAS'; exit 1; }
          test -n "$EMUHUB_KEY_PASSWORD" || { echo 'Missing EMUHUB_KEY_PASSWORD'; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$EMUHUB_KEYSTORE_PATH"
          keytool -list -keystore "$EMUHUB_KEYSTORE_PATH" -storepass "$EMUHUB_KEYSTORE_PASSWORD" -alias "$EMUHUB_KEY_ALIAS" >/dev/null

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Download internal libretro cores
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/cores
          fetch_core() {
            local name="$1" out="$2"
            rm -rf "/tmp/cores/$name"; mkdir -p "/tmp/cores/$name"
            curl --retry 3 --retry-delay 2 -fL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${name}_libretro_android.so.zip" -o "/tmp/cores/$name.zip"
            unzip -q "/tmp/cores/$name.zip" -d "/tmp/cores/$name"
            cp "$(find "/tmp/cores/$name" -type f -name '*.so' | head -1)" "app/src/main/jniLibs/arm64-v8a/$out"
          }
          fetch_core mgba libmgba_core.so
          fetch_core fceumm libfceumm_core.so
          fetch_core snes9x libsnes9x_core.so
          fetch_core pcsx_rearmed libpcsx_rearmed_core.so
          fetch_core ppsspp libppsspp_core.so

      - name: Stage PPSSPP runtime assets
        run: |
          rm -rf app/src/main/assets/PPSSPP /tmp/ppsspp-src
          mkdir -p app/src/main/assets/PPSSPP /tmp/ppsspp-src
          curl --retry 3 --retry-delay 2 -fL "https://github.com/hrydgard/ppsspp/archive/refs/tags/v1.20.4.tar.gz" -o /tmp/ppsspp-src.tar.gz
          tar -xzf /tmp/ppsspp-src.tar.gz -C /tmp/ppsspp-src --strip-components=1
          cp -a /tmp/ppsspp-src/assets/. app/src/main/assets/PPSSPP/

      - name: Stage ARMSX2 runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-armsx2-android.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          rm -rf /tmp/armsx2-runtime
          mkdir -p /tmp/armsx2-runtime app/src/main/jniLibs/arm64-v8a app/src/main/assets/ARMSX2
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n ARMSX2-Android-ARM64-Runtime -D /tmp/armsx2-runtime
          cp -a /tmp/armsx2-runtime/jniLibs/arm64-v8a/. app/src/main/jniLibs/arm64-v8a/
          rm -rf app/src/main/assets/ARMSX2; mkdir -p app/src/main/assets/ARMSX2
          cp -a /tmp/armsx2-runtime/assets/ARMSX2/. app/src/main/assets/ARMSX2/
          test -s app/src/main/jniLibs/arm64-v8a/libemucore_4k.so

      - name: Prepare thin app shell
        if: ${{ inputs.thin_shell }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/src/main/jniLibs/arm64-v8a/libmgba_core.so \
                app/src/main/jniLibs/arm64-v8a/libfceumm_core.so \
                app/src/main/jniLibs/arm64-v8a/libsnes9x_core.so \
                app/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_core.so \
                app/src/main/jniLibs/arm64-v8a/libppsspp_core.so
          rm -rf app/src/main/assets/PPSSPP
          echo 'Thin shell enabled: reusable libretro engines and PPSSPP assets excluded from APK.'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable signed release APK
        run: gradle assembleRelease --build-cache --parallel --stacktrace

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/EmuHub-v${EMUHUB_VERSION_NAME}-arm64.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Publish GitHub Release used by in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${EMUHUB_VERSION_CODE}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Increase version_code." >&2
            exit 1
          fi
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Emu Hub ${EMUHUB_VERSION_NAME}" \
            --notes "${{ inputs.notes }}"

      - uses: actions/upload-artifact@v4
        with:
          name: EmuHub-Stable-v${{ inputs.version_name }}
          path: dist/*
          if-no-files-found: error
