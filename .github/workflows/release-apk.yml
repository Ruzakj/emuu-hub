name: Publish Stable In-App Update

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode'
        required: true
        type: string
      version_name:
        description: 'Visible version'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: false
        default: 'Emu Hub update'
        type: string
      thin_shell:
        description: 'Exclude reusable classic cores + PPSSPP assets'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  EMUHUB_VERSION_CODE: ${{ inputs.version_code }}
  EMUHUB_VERSION_NAME: ${{ inputs.version_name }}
  EMUHUB_KEYSTORE_PATH: /tmp/emuhub-release.jks
  EMUHUB_KEYSTORE_PASSWORD: ${{ secrets.EMUHUB_KEYSTORE_PASSWORD }}
  EMUHUB_KEY_ALIAS: ${{ secrets.EMUHUB_KEY_ALIAS }}
  EMUHUB_KEY_PASSWORD: ${{ secrets.EMUHUB_KEY_PASSWORD }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Validate and normalize stable signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.EMUHUB_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$EMUHUB_KEYSTORE_PASSWORD"
          test -n "$EMUHUB_KEY_ALIAS"
          test -n "$EMUHUB_KEY_PASSWORD"
          SOURCE_STORE=/tmp/emuhub-source.jks
          NORMALIZED_STORE=/tmp/emuhub-normalized.p12
          NORMALIZED_PASS='EmuHubNormalizedRelease2026!'
          echo "$KEYSTORE_B64" | base64 -d > "$SOURCE_STORE"
          keytool -list -keystore "$SOURCE_STORE" -storepass "$EMUHUB_KEYSTORE_PASSWORD" -alias "$EMUHUB_KEY_ALIAS" >/dev/null
          normalize_with() {
            local keypass="$1"
            rm -f "$NORMALIZED_STORE"
            keytool -importkeystore -srckeystore "$SOURCE_STORE" -srcstorepass "$EMUHUB_KEYSTORE_PASSWORD" -srcalias "$EMUHUB_KEY_ALIAS" -srckeypass "$keypass" -destkeystore "$NORMALIZED_STORE" -deststoretype PKCS12 -deststorepass "$NORMALIZED_PASS" -destkeypass "$NORMALIZED_PASS" -noprompt >/dev/null 2>&1
          }
          if normalize_with "$EMUHUB_KEY_PASSWORD"; then :; elif normalize_with "$EMUHUB_KEYSTORE_PASSWORD"; then :; else exit 1; fi
          echo "EMUHUB_KEYSTORE_PATH=$NORMALIZED_STORE" >> "$GITHUB_ENV"
          echo "EMUHUB_KEYSTORE_PASSWORD=$NORMALIZED_PASS" >> "$GITHUB_ENV"
          echo "EMUHUB_KEY_PASSWORD=$NORMALIZED_PASS" >> "$GITHUB_ENV"

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Download internal libretro cores including Dolphin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/cores
          fetch_core() {
            local name="$1" out="$2"
            rm -rf "/tmp/cores/$name"; mkdir -p "/tmp/cores/$name"
            curl --retry 3 --retry-delay 2 -fL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${name}_libretro_android.so.zip" -o "/tmp/cores/$name.zip"
            unzip -q "/tmp/cores/$name.zip" -d "/tmp/cores/$name"
            cp "$(find "/tmp/cores/$name" -type f -name '*.so' | head -1)" "app/src/main/jniLibs/arm64-v8a/$out"
          }
          fetch_core mgba libmgba_core.so
          fetch_core fceumm libfceumm_core.so
          fetch_core snes9x libsnes9x_core.so
          fetch_core pcsx_rearmed libpcsx_rearmed_core.so
          fetch_core ppsspp libppsspp_core.so
          fetch_core dolphin libdolphin_core.so
          test -s app/src/main/jniLibs/arm64-v8a/libdolphin_core.so

      - name: Stage Dolphin Sys runtime zip
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/dolphin-libretro app/src/main/assets/Dolphin
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/libretro/dolphin.git /tmp/dolphin-libretro
          test -s /tmp/dolphin-libretro/Data/Sys/GC/font_western.bin
          test -s /tmp/dolphin-libretro/Data/Sys/GC/dsp_rom.bin
          test -s /tmp/dolphin-libretro/Data/Sys/GC/dsp_coef.bin
          mkdir -p app/src/main/assets/Dolphin
          (cd /tmp/dolphin-libretro/Data/Sys && zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/Dolphin/Sys.zip" .)
          test -s app/src/main/assets/Dolphin/Sys.zip
          unzip -l app/src/main/assets/Dolphin/Sys.zip | grep -F 'GC/font_western.bin'
          unzip -l app/src/main/assets/Dolphin/Sys.zip | grep -F 'GC/dsp_rom.bin'
          unzip -l app/src/main/assets/Dolphin/Sys.zip | grep -F 'GC/dsp_coef.bin'

      - name: Stage PPSSPP runtime assets
        run: |
          rm -rf app/src/main/assets/PPSSPP /tmp/ppsspp-src
          mkdir -p app/src/main/assets/PPSSPP /tmp/ppsspp-src
          curl --retry 3 --retry-delay 2 -fL "https://github.com/hrydgard/ppsspp/archive/refs/tags/v1.20.4.tar.gz" -o /tmp/ppsspp-src.tar.gz
          tar -xzf /tmp/ppsspp-src.tar.gz -C /tmp/ppsspp-src --strip-components=1
          cp -a /tmp/ppsspp-src/assets/. app/src/main/assets/PPSSPP/

      - name: Stage ARMSX2 runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-armsx2-android.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          rm -rf /tmp/armsx2-runtime
          mkdir -p /tmp/armsx2-runtime app/src/main/jniLibs/arm64-v8a app/src/main/assets/ARMSX2
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n ARMSX2-Android-ARM64-Runtime -D /tmp/armsx2-runtime
          cp -a /tmp/armsx2-runtime/jniLibs/arm64-v8a/. app/src/main/jniLibs/arm64-v8a/
          rm -rf app/src/main/assets/ARMSX2; mkdir -p app/src/main/assets/ARMSX2
          cp -a /tmp/armsx2-runtime/assets/ARMSX2/. app/src/main/assets/ARMSX2/
          test -s app/src/main/jniLibs/arm64-v8a/libemucore_4k.so

      - name: Stage small legal homebrew starter ROMs
        run: |
          set -euxo pipefail
          ROOT=app/src/main/assets/builtin-roms
          rm -rf "$ROOT"; mkdir -p "$ROOT/NES" "$ROOT/GBA" "$ROOT/SNES"
          curl --retry 3 --retry-delay 2 -fL "https://raw.githubusercontent.com/rlannon/NES_GalaxyPatrol/master/galaxypatrol.nes" -o "$ROOT/NES/Galaxy Patrol.nes"
          curl --retry 3 --retry-delay 2 -fL "https://raw.githubusercontent.com/benoror/gbadev/master/public/roms/%40rkanoid%20MODERN%20-%20RECOMPILED.gba" -o "$ROOT/GBA/Rkanoid Modern.gba"
          curl --retry 3 --retry-delay 2 -fL "https://raw.githubusercontent.com/benoror/gbadev/master/public/roms/%40rkanoid%20LATEST%20-%20DEMO.gba" -o "$ROOT/GBA/Rkanoid Demo.gba"
          curl --retry 3 --retry-delay 2 -fL "https://github.com/donth77/snes-homebrew/releases/download/v1.0.0/gothicvania.sfc" -o "$ROOT/SNES/Gothicvania.sfc"
          curl --retry 3 --retry-delay 2 -fL "https://github.com/donth77/snes-homebrew/releases/download/v1.0.0/hello-world-region.sfc" -o "$ROOT/SNES/Hello World Region.sfc"

      - name: Prepare thin app shell but keep Dolphin internal
        if: ${{ inputs.thin_shell }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/src/main/jniLibs/arm64-v8a/libmgba_core.so app/src/main/jniLibs/arm64-v8a/libfceumm_core.so app/src/main/jniLibs/arm64-v8a/libsnes9x_core.so app/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_core.so app/src/main/jniLibs/arm64-v8a/libppsspp_core.so
          rm -rf app/src/main/assets/PPSSPP
          test -s app/src/main/jniLibs/arm64-v8a/libdolphin_core.so
          test -s app/src/main/assets/Dolphin/Sys.zip

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable signed release APK
        run: gradle assembleRelease --build-cache --parallel --stacktrace

      - name: Verify signed APK contains Dolphin core and runtime zip
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libdolphin_core.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libemuhost.so"
          unzip -l "$APK" | grep -F "assets/Dolphin/Sys.zip"
          unzip -p "$APK" assets/Dolphin/Sys.zip > /tmp/DolphinSys.zip
          test -s /tmp/DolphinSys.zip
          unzip -l /tmp/DolphinSys.zip | grep -F 'GC/font_western.bin'
          unzip -l /tmp/DolphinSys.zip | grep -F 'GC/dsp_rom.bin'
          unzip -l /tmp/DolphinSys.zip | grep -F 'GC/dsp_coef.bin'
          mkdir -p dist
          cp "$APK" "dist/EmuHub-v${EMUHUB_VERSION_NAME}-arm64.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Publish GitHub Release used by in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${EMUHUB_VERSION_CODE}"
          TITLE="Emu Hub ${EMUHUB_VERSION_NAME}"
          NOTES='${{ inputs.notes }}'
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qE '\.apk$'
          echo "Release $TAG contains internal Dolphin and is ready for in-app update."

      - uses: actions/upload-artifact@v4
        with:
          name: EmuHub-Stable-v${{ inputs.version_name }}
          path: dist/*
          if-no-files-found: error
