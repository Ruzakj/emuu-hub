name: Add PS2 Full Controls Savestate
on:
  push:
    paths:
      - '.github/workflows/add-ps2-full-controls-savestate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PS2 controls and savestates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Expose savestate JNI already present in the bundled ARMSX2 core.
          p=Path('app/src/main/java/kr/co/iefriends/pcsx2/NativeApp.java')
          s=p.read_text()
          anchor='    public static native void commitSettings();\n'
          add='''    public static native void commitSettings();\n    public static native boolean saveStateToSlot(int slot);\n    public static native boolean loadStateFromSlot(int slot);\n    public static native boolean isMemcardBusy();\n'''
          if 'saveStateToSlot(int slot)' not in s:
              if anchor not in s: raise SystemExit('NativeApp anchor missing')
              s=s.replace(anchor,add,1)
          p.write_text(s)

          p=Path('app/src/main/java/com/ric/emuhub/Ps2GameActivity.kt')
          s=p.read_text()

          # State slot field.
          anchor='    private var vmThread: Thread? = null\n'
          add='''    private var vmThread: Thread? = null\n    private var stateSlot = 0\n    private var stateSlotButton: Button? = null\n'''
          if 'private var stateSlot = 0' not in s:
              if anchor not in s: raise SystemExit('state field anchor missing')
              s=s.replace(anchor,add,1)

          # Make analog stick reusable for left/right axes.
          s=s.replace('private inner class AnalogStickView : View(this@Ps2GameActivity) {',
                      'private inner class AnalogStickView(private val rightStick: Boolean = false) : View(this@Ps2GameActivity) {',1)
          old='''                    sendAnalogPair(nx, PAD_L_LEFT, PAD_L_RIGHT)\n                    sendAnalogPair(ny, PAD_L_UP, PAD_L_DOWN)'''
          new='''                    if (rightStick) {\n                        sendAnalogPair(nx, PAD_R_LEFT, PAD_R_RIGHT)\n                        sendAnalogPair(ny, PAD_R_UP, PAD_R_DOWN)\n                    } else {\n                        sendAnalogPair(nx, PAD_L_LEFT, PAD_L_RIGHT)\n                        sendAnalogPair(ny, PAD_L_UP, PAD_L_DOWN)\n                    }'''
          if old not in s: raise SystemExit('analog move anchor missing')
          s=s.replace(old,new,1)
          old='''                    sendPad(PAD_L_LEFT, false); sendPad(PAD_L_RIGHT, false)\n                    sendPad(PAD_L_UP, false); sendPad(PAD_L_DOWN, false)'''
          new='''                    if (rightStick) {\n                        sendPad(PAD_R_LEFT, false); sendPad(PAD_R_RIGHT, false)\n                        sendPad(PAD_R_UP, false); sendPad(PAD_R_DOWN, false)\n                    } else {\n                        sendPad(PAD_L_LEFT, false); sendPad(PAD_L_RIGHT, false)\n                        sendPad(PAD_L_UP, false); sendPad(PAD_L_DOWN, false)\n                    }'''
          if old not in s: raise SystemExit('analog release anchor missing')
          s=s.replace(old,new,1)

          # Add right analog, L3/R3, slot selector and save/load controls.
          anchor='''            addControl(root, AnalogStickView(), Gravity.BOTTOM or Gravity.START, left = 205, bottom = 28, w = 132, h = 132)\n'''
          repl='''            addControl(root, AnalogStickView(false), Gravity.BOTTOM or Gravity.START, left = 205, bottom = 28, w = 132, h = 132)\n            addControl(root, control("L3", KeyEvent.KEYCODE_BUTTON_THUMBL, 48), Gravity.BOTTOM or Gravity.START, left = 247, bottom = 166, w = 48, h = 36)\n            addControl(root, AnalogStickView(true), Gravity.BOTTOM or Gravity.END, right = 205, bottom = 28, w = 132, h = 132)\n            addControl(root, control("R3", KeyEvent.KEYCODE_BUTTON_THUMBR, 48), Gravity.BOTTOM or Gravity.END, right = 247, bottom = 166, w = 48, h = 36)\n'''
          if anchor not in s: raise SystemExit('left stick UI anchor missing')
          s=s.replace(anchor,repl,1)

          anchor='''            addControl(root, control("START", KeyEvent.KEYCODE_BUTTON_START, 58), Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL, right = -62, bottom = 22, w = 76, h = 36)\n'''
          repl='''            addControl(root, control("START", KeyEvent.KEYCODE_BUTTON_START, 58), Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL, right = -62, bottom = 22, w = 76, h = 36)\n\n            stateSlotButton = Button(this).apply {\n                text = "S0"; textSize = 10f; isAllCaps = false; setTextColor(Color.WHITE); background = rounded()\n                setOnClickListener { stateSlot = (stateSlot + 1) % 10; text = "S$stateSlot" }\n            }\n            addControl(root, stateSlotButton!!, Gravity.TOP or Gravity.CENTER_HORIZONTAL, left = -82, top = 8, w = 50, h = 38)\n            addControl(root, Button(this).apply { text = "SAVE"; textSize = 10f; isAllCaps = false; setTextColor(Color.WHITE); background = rounded(); setOnClickListener { saveStateNow() } }, Gravity.TOP or Gravity.CENTER_HORIZONTAL, top = 8, w = 64, h = 38)\n            addControl(root, Button(this).apply { text = "LOAD"; textSize = 10f; isAllCaps = false; setTextColor(Color.WHITE); background = rounded(); setOnClickListener { loadStateNow() } }, Gravity.TOP or Gravity.CENTER_HORIZONTAL, right = -82, top = 8, w = 64, h = 38)\n'''
          if anchor not in s: raise SystemExit('start UI anchor missing')
          s=s.replace(anchor,repl,1)

          # Real native save/load operations. Native side handles VM pause/thread marshalling.
          anchor='''    private fun prepareRuntime() {\n'''
          funcs='''    private fun saveStateNow() {\n        if (!initialized || biosOnly) return\n        val slot = stateSlot\n        Toast.makeText(this, "Saving state S$slot...", Toast.LENGTH_SHORT).show()\n        Thread({\n            val busy = runCatching { NativeApp.isMemcardBusy() }.getOrDefault(false)\n            val ok = if (busy) false else runCatching { NativeApp.saveStateToSlot(slot) }.getOrDefault(false)\n            runOnUiThread {\n                Toast.makeText(this, if (ok) "State S$slot saved" else if (busy) "Memory card busy — coba lagi setelah beberapa detik" else "Save state S$slot gagal", Toast.LENGTH_SHORT).show()\n            }\n        }, "ps2-save-state").start()\n    }\n\n    private fun loadStateNow() {\n        if (!initialized || biosOnly) return\n        val slot = stateSlot\n        Toast.makeText(this, "Loading state S$slot...", Toast.LENGTH_SHORT).show()\n        Thread({\n            val ok = runCatching { NativeApp.loadStateFromSlot(slot) }.getOrDefault(false)\n            runOnUiThread { Toast.makeText(this, if (ok) "State S$slot loaded" else "Tidak ada / gagal load state S$slot", Toast.LENGTH_SHORT).show() }\n        }, "ps2-load-state").start()\n    }\n\n    private fun prepareRuntime() {\n'''
          if 'private fun saveStateNow()' not in s:
              if anchor not in s: raise SystemExit('prepareRuntime anchor missing')
              s=s.replace(anchor,funcs,1)

          p.write_text(s)
          PY
          rm .github/workflows/add-ps2-full-controls-savestate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main .github/workflows/add-ps2-full-controls-savestate.yml
          git commit -m 'Add PS2 right stick L3 R3 and savestates'
          git push
