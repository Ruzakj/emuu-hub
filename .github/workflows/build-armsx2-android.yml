name: Build ARMSX2 Android Native

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-armsx2-android.yml'

concurrency:
  group: armsx2-android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-armsx2-android:
    name: ARMSX2 Android arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Emu Hub
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Checkout ARMSX2 upstream
        run: |
          git clone --depth 1 https://github.com/ARMSX2/ARMSX2.git /tmp/armsx2
          git -C /tmp/armsx2 rev-parse HEAD | tee /tmp/armsx2-source-sha.txt

      - name: Fetch shaderc dependencies
        working-directory: /tmp/armsx2/platforms/android
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build ARMSX2 Android release
        working-directory: /tmp/armsx2/platforms/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Collect Emu Hub PS2 runtime bundle
        run: |
          set -euxo pipefail
          APK=$(find /tmp/armsx2/platforms/android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -n "$APK"
          rm -rf /tmp/armsx2-runtime
          mkdir -p /tmp/armsx2-runtime/jniLibs/arm64-v8a /tmp/armsx2-runtime/assets/ARMSX2

          unzip -j "$APK" \
            'lib/arm64-v8a/libemucore_4k.so' \
            'lib/arm64-v8a/liblibrashader_capi.so' \
            'lib/arm64-v8a/libc++_shared.so' \
            -d /tmp/armsx2-runtime/jniLibs/arm64-v8a

          unzip -q "$APK" 'assets/resources/*' -d /tmp/armsx2-assets
          cp -a /tmp/armsx2-assets/assets/resources/. /tmp/armsx2-runtime/assets/ARMSX2/
          cp /tmp/armsx2-source-sha.txt /tmp/armsx2-runtime/SOURCE_SHA.txt

          test -s /tmp/armsx2-runtime/jniLibs/arm64-v8a/libemucore_4k.so
          test -s /tmp/armsx2-runtime/jniLibs/arm64-v8a/liblibrashader_capi.so
          test -s /tmp/armsx2-runtime/jniLibs/arm64-v8a/libc++_shared.so
          test -s /tmp/armsx2-runtime/assets/ARMSX2/GameIndex.yaml

          echo 'Native dependencies:'
          readelf -d /tmp/armsx2-runtime/jniLibs/arm64-v8a/libemucore_4k.so | grep NEEDED || true
          du -sh /tmp/armsx2-runtime

      - name: Upload Emu Hub PS2 runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-Android-ARM64-Runtime
          path: /tmp/armsx2-runtime/
          compression-level: 0
          if-no-files-found: error

      - name: Upload reference APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-Android-Reference-APK
          path: /tmp/armsx2/platforms/android/app/build/outputs/apk/**/*.apk
          compression-level: 0
          if-no-files-found: error
