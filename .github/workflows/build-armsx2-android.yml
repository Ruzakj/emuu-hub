name: Build ARMSX2 Android Native

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-armsx2-android.yml'

concurrency:
  group: armsx2-android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-armsx2-android:
    name: ARMSX2 Android arm64 lean
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Emu Hub
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          # Android 37 is not published by sdkmanager on this runner yet. The PS2
          # runtime does not require API-37-only Java APIs, so build our embedded
          # runtime against the newest platform available here and patch the
          # upstream app module to match after checkout.
          sdkmanager "platforms;android-35" "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"

      - name: Checkout pinned ARMSX2 source
        run: |
          set -euxo pipefail
          rm -rf /tmp/armsx2
          git clone https://github.com/ARMSX2/ARMSX2.git /tmp/armsx2
          git -C /tmp/armsx2 checkout 1024c3538ee2ff27fc0f9d5272d76202b8b1c03b
          git -C /tmp/armsx2 rev-parse HEAD | tee /tmp/armsx2-source-sha.txt

      - name: Patch ARMSX2 for Emu Hub embedding
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('/tmp/armsx2/platforms/android/app/build.gradle.kts')
          g = gradle.read_text()
          if 'compileSdk = 37' not in g or 'targetSdk = 37' not in g:
              raise SystemExit('Expected ARMSX2 API 37 declarations were not found')
          g = g.replace('compileSdk = 37', 'compileSdk = 36', 1)
          g = g.replace('targetSdk = 37', 'targetSdk = 36', 1)
          gradle.write_text(g)

          cmake = Path('/tmp/armsx2/platforms/android/app/src/main/cpp/CMakeLists.txt')
          s = cmake.read_text()
          old = 'add_subdirectory(3rdparty/librashader)'
          if old not in s:
              raise SystemExit('librashader hook not found')
          s = s.replace(
              old,
              'set(ARMSX2_HAVE_LIBRASHADER OFF)\nmessage(STATUS "Emu Hub lean build: librashader disabled")',
              1,
          )
          cmake.write_text(s)
          PY
          grep -n 'compileSdk = 36\|targetSdk = 36' /tmp/armsx2/platforms/android/app/build.gradle.kts
          grep -n 'lean build: librashader disabled' /tmp/armsx2/platforms/android/app/src/main/cpp/CMakeLists.txt

      - name: Fetch shaderc dependencies
        working-directory: /tmp/armsx2/platforms/android
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Build lean ARMSX2 Android release
        working-directory: /tmp/armsx2/platforms/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: ./gradlew :app:assembleGithubRelease --stacktrace --no-daemon

      - name: Collect complete lean runtime
        run: |
          set -euxo pipefail
          APK=$(find /tmp/armsx2/platforms/android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -n "$APK"
          rm -rf /tmp/armsx2-runtime /tmp/armsx2-assets /tmp/armsx2-libs
          mkdir -p /tmp/armsx2-runtime/jniLibs/arm64-v8a /tmp/armsx2-runtime/assets/ARMSX2 /tmp/armsx2-assets /tmp/armsx2-libs

          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d /tmp/armsx2-libs
          cp -a /tmp/armsx2-libs/lib/arm64-v8a/. /tmp/armsx2-runtime/jniLibs/arm64-v8a/
          unzip -q "$APK" 'assets/resources/*' -d /tmp/armsx2-assets
          cp -a /tmp/armsx2-assets/assets/resources/. /tmp/armsx2-runtime/assets/ARMSX2/
          cp /tmp/armsx2-source-sha.txt /tmp/armsx2-runtime/SOURCE_SHA.txt

          CORE=/tmp/armsx2-runtime/jniLibs/arm64-v8a/libemucore_4k.so
          test -s "$CORE"
          test -s /tmp/armsx2-runtime/assets/ARMSX2/GameIndex.yaml

          echo '=== emucore NEEDED ==='
          readelf -d "$CORE" | grep NEEDED || true
          if readelf -d "$CORE" | grep -q 'liblibrashader_capi.so'; then
            echo 'ERROR: lean core still depends on librashader' >&2
            exit 1
          fi
          echo 'Lean runtime files:'
          find /tmp/armsx2-runtime/jniLibs/arm64-v8a -maxdepth 1 -type f -name '*.so' -printf '%f\n' | sort

      - name: Upload Emu Hub PS2 runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-Android-ARM64-Runtime
          path: /tmp/armsx2-runtime/
          compression-level: 0
          if-no-files-found: error

      - name: Upload reference APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-Android-Reference-APK
          path: /tmp/armsx2/platforms/android/app/build/outputs/apk/**/*.apk
          compression-level: 0
          if-no-files-found: error
