name: Build Emu Hub Libretro Dolphin

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/ric/emuhub/EmuHubApp.kt'
      - 'app/src/main/java/com/ric/emuhub/MainActivity.kt'
      - 'app/src/main/java/com/ric/emuhub/GameActivity.kt'
      - 'app/src/main/cpp/emuhost.cpp'
      - '.github/workflows/build-libretro-dolphin.yml'
      - '.github/workflows/switch-gc-wii-to-libretro.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Reject obsolete external or AAR Dolphin integration
        run: |
          set -euxo pipefail
          ! grep -R "Dolphin Emulator diperlukan\|DOWNLOAD DOLPHIN\|dolphin-emu.org/download\|DOLPHIN_PACKAGE" app/src/main/java/com/ric/emuhub
          ! grep -R "org.dolphinemu.dolphinemu" app/src/main/java app/build.gradle.kts
          ! grep -q 'dolphin-runtime.aar' app/build.gradle.kts

      - name: Stage standard Emu Hub cores
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/cores
          fetch_core() {
            local remote="$1" localname="$2"
            rm -rf /tmp/core-unpack && mkdir -p /tmp/core-unpack
            curl --retry 3 --retry-delay 2 -fL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${remote}_libretro_android.so.zip" -o /tmp/core.zip
            unzip -q /tmp/core.zip -d /tmp/core-unpack
            cp "$(find /tmp/core-unpack -type f -name '*.so' | head -1)" "app/src/main/jniLibs/arm64-v8a/${localname}"
          }
          fetch_core mgba libmgba_core.so
          fetch_core fceumm libfceumm_core.so
          fetch_core snes9x libsnes9x_core.so
          fetch_core pcsx_rearmed libpcsx_rearmed_core.so
          fetch_core ppsspp libppsspp_core.so
          fetch_core dolphin libdolphin_core.so

      - name: Stage Dolphin Sys assets
        run: |
          set -euxo pipefail
          rm -rf /tmp/dolphin-libretro app/src/main/assets/Dolphin
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/libretro/dolphin.git /tmp/dolphin-libretro
          test -d /tmp/dolphin-libretro/Data/Sys
          mkdir -p app/src/main/assets/Dolphin/Sys
          cp -a /tmp/dolphin-libretro/Data/Sys/. app/src/main/assets/Dolphin/Sys/
          test -s app/src/main/assets/Dolphin/Sys/GC/font_western.bin
          test -s app/src/main/assets/Dolphin/Sys/GC/dsp_rom.bin
          test -s app/src/main/assets/Dolphin/Sys/GC/dsp_coef.bin

      - name: Stage PPSSPP assets
        run: |
          rm -rf app/src/main/assets/PPSSPP /tmp/ppsspp-src
          mkdir -p app/src/main/assets/PPSSPP /tmp/ppsspp-src
          curl --retry 3 --retry-delay 2 -fL "https://github.com/hrydgard/ppsspp/archive/refs/tags/v1.20.4.tar.gz" -o /tmp/ppsspp-src.tar.gz
          tar -xzf /tmp/ppsspp-src.tar.gz -C /tmp/ppsspp-src --strip-components=1
          cp -a /tmp/ppsspp-src/assets/. app/src/main/assets/PPSSPP/

      - name: Restore ARMSX2 runtime from latest successful normal build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-apk.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          rm -rf /tmp/base /tmp/base-apk && mkdir -p /tmp/base
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n EmuHub-InternalCores-debug -D /tmp/base
          APK=$(find /tmp/base -type f -name '*.apk' | head -1)
          test -n "$APK"
          mkdir -p /tmp/base-apk
          unzip -q "$APK" -d /tmp/base-apk
          cp /tmp/base-apk/lib/arm64-v8a/libemucore_4k.so app/src/main/jniLibs/arm64-v8a/
          cp -a /tmp/base-apk/assets/ARMSX2 app/src/main/assets/ || true
          cp -a /tmp/base-apk/assets/builtin-roms app/src/main/assets/ || true

      - name: Verify internal cores
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libdolphin_core.so
          test -s app/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_core.so
          test -s app/src/main/jniLibs/arm64-v8a/libppsspp_core.so
          test -s app/src/main/assets/Dolphin/Sys/GC/font_western.bin
          test -s app/src/main/assets/Dolphin/Sys/GC/dsp_rom.bin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --build-cache --stacktrace

      - name: Verify final APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libdolphin_core.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libpcsx_rearmed_core.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libemucore_4k.so'
          unzip -l "$APK" | grep 'assets/Dolphin/Sys/GC/font_western.bin'
          unzip -l "$APK" | grep 'assets/Dolphin/Sys/GC/dsp_rom.bin'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmuHub-Internal-Dolphin-Core-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
