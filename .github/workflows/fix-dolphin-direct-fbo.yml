name: Fix Dolphin Direct FBO
on:
  push:
    paths:
      - '.github/scripts/fix_dolphin_direct_fbo.py'
      - '.github/workflows/fix-dolphin-direct-fbo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch native renderer
        run: python3 .github/scripts/fix_dolphin_direct_fbo.py
      - name: Verify
        run: |
          grep -q 'direct FBO ready' app/src/main/cpp/emuhost.cpp
          grep -q 'glBlitFramebuffer' app/src/main/cpp/emuhost.cpp
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/cpp/emuhost.cpp
          git commit -m 'Fix Dolphin black screen with frontend FBO' || exit 0
          git push
