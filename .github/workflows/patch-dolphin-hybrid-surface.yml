name: Patch Dolphin Hybrid Surface

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-dolphin-hybrid-surface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply hybrid GPU surface patch
        run: python3 tools/patch_dolphin_hybrid_surface.py
      - name: Verify hybrid renderer
        run: |
          git diff --check
          grep -q 'pbuffer + window surfaces ready' app/src/main/cpp/emuhost.cpp
          grep -q 'hybrid GPU presentation ready' app/src/main/cpp/emuhost.cpp
          grep -q 'glCopyTexSubImage2D' app/src/main/cpp/emuhost.cpp
          grep -q 'return 0;' app/src/main/cpp/emuhost.cpp
      - name: Commit hybrid renderer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/cpp/emuhost.cpp
          git commit -m 'Use hybrid GPU presentation for Dolphin'
          git push origin main
